# The `ci` profile is what .github/workflows/ci.yml runs, hash-partitioned across shards.
#
# nextest runs each test in its own process, so a test binary whose tests share one analysis
# through a `OnceLock` repeats it in every test: issue_drafting's tests took 1136 s in all under
# nextest (CI run 37848776092) against 57 s for the binary under its own harness (CI run
# 37851506194), and issue_trust's 314 s against 90 s. The profile leaves those binaries out, and
# the workflow's `harness` job runs whatever binaries it leaves out whole.
# Steerability also shares each part analysis and its Spec variants within one process;
# the existing harness job discovers and runs it whole through this default-filter.
# Latency gates measure interactive edits; run them without competing test processes.
# Their native 150 ms assertions remain enabled, including in local shard simulations.
[[profile.default.overrides]]
filter = 'test(=r5_multi_sheet_latency) | (binary(=session) & test(_benchmark_deltas))'
threads-required = "num-cpus"

# Aggregate audits retain their global assertions and use at most four scoped workers.
# Reserve two slots: keep concurrency bounded while other cases fill uneven worker tails.
# The ci profile inherits the same reservation.
[[profile.default.overrides]]
filter = '''
    (binary(=audits) & test(/^items::/)) & not test(=items::a_problems_fix_resolves_it)
        & not test(/^items::on_the_quality_part::/)
    | test(=problem_wording::only_sheet_problems_have_the_sheet_as_subject)
    | test(=problem_wording::no_problem_message_carries_an_internal_id)
    | test(=interior_placement::all_quality_parts_interior_lines_arrows_and_tips_clear_rendered_ink)
    | test(pinning_every_callout_at_its_reported_offset_moves_nothing::)
'''
threads-required = 2

# Whole-corpus wording audits are still long even with bounded workers. Start them before
# individual NIST cases so their final part does not become the shard's last task.
[[profile.default.overrides]]
filter = 'test(=problem_wording::only_sheet_problems_have_the_sheet_as_subject) | test(=problem_wording::no_problem_message_carries_an_internal_id)'
priority = 100

[profile.ci]
default-filter = 'not (binary(issue_drafting) | binary(issue_trust) | binary(steerability))'
fail-fast = false

# Per-test durations for tools/test_shards.py --record.
[profile.ci.junit]
path = "junit.xml"

# A shard's wall clock is bounded below by its longest test, so the tests that take most of a
# minute or more on CI start first rather than last. Named NIST cases replace the long
# all-fixture PMI loops; reserve early slots for the remaining aggregate audits too.
# Share this ordering with the default full-suite run; ci inherits the same overrides.
[[profile.default.overrides]]
filter = '''
    test(/^items::on_the_quality_part::/)
    | test(=items::every_plan_item_has_a_state_and_every_problem_subject_is_a_live_item)
    | test(=problem_wording::only_sheet_problems_have_the_sheet_as_subject)
    | test(=problem_wording::no_problem_message_carries_an_internal_id)
    | test(=interior_placement::all_quality_parts_interior_lines_arrows_and_tips_clear_rendered_ink)
    | test(=pmi_labels::common_labels_are_drawn_with_leaders_and_searchable)
    | test(=label_text::pmi_callout_wording_is_reserved_drawn_searchable_and_structured_symbols_refuse_it)
    | test(=gdt_band::ctc_02_frames_and_datum_symbols_are_inside_their_bands_and_on_the_sheet)
    | test(nist_ctc_02_asme1_ap242_e2)
    | test(nist_ftc_10_asme1_ap242_e2)
    | test(nist_stc_09_asme1_ap242_e4)
    | test(pinning_every_callout_at_its_reported_offset_moves_nothing::)
    | test(=model::the_drawings_problems_reach_review_and_render)
    | test(=output::cgb242_is_drawn_whole)
    | test(=lint::lint_on_the_ports_own_drawings_is_known)
    | test(=native::native_features_match_the_bridge_or_are_listed)
    | test(=lint_structural::structural_findings_on_the_ports_own_drawings_are_known)
    | test(=bridge::face_areas_differ_from_opencascades_only_as_listed)
    | (binary(=audits) & test(/^trust_rules::/))
    | test(=cli_native::corpus_parts_render_natively_naming_what_is_not_recognised)
    | test(=dims_slots::a_turned_parts_coaxial_bosses_are_profile_bands_and_a_groove_floor_is_the_grooves)
'''
priority = 80

# The other tests that took two minutes or more in a CI shard (CI runs 39835970005 and
# 39841898867) also start first, so none becomes its shard's tail.
[[profile.default.overrides]]
filter = '''
    test(nist_ctc_02_asme1_rc)
    | test(=placement_intent::seeded_edits_on_slice_parts_preserve_pinned_geometry)
    | test(=placement_intent::pinning_without_offsets_keeps_automatic_geometry)
    | test(=placement_intent::a_bare_pin_relays_its_own_label_when_its_text_changes)
    | test(=fit_label_layout::crowded_h7_hole_label_clears_the_dimension_stack)
    | test(=repeated_labels::every_repeated_label_on_the_quality_parts_has_a_verdict)
    | test(=table_symbols::quality_parts_have_no_unsupported_table_or_note_glyphs)
    | test(=stateless::s0_edits_through_http_serve_and_session_have_identical_specs_plans_and_deltas)
    | test(=stateless::warm_cache_and_fresh_process_are_byte_identical_to_session)
    | test(=stateless::four_slice_parts_default_payloads_are_bounded_and_paging_is_lossless)
    | test(=authored_dimensions::cylinders_spheres_and_axis_offsets_are_measured_and_linted)
    | test(=sheet_policy::tests::automatic_pins_keep_canonical_paper_scale_and_sheet_count)
    | test(=problem_wording::fix_descriptions_use_drawing_language_across_fixtures_and_corpus)
    | test(=problem_wording::problems_keep_tool_diagnostics_out_of_drawing_messages)
    | test(=planned_hole_tables::non_hole_pins_keep_the_settled_schedule_and_isometric_frame)
    | test(=sheets::r5_narrow_section_blocks_reserve_caption_and_reference_width)
    | test(=modelled_thread_layout::modelled_thread_callouts_clear_labels_and_dimension_ink)
    | test(=hole_tables::a_table_without_every_balloon_is_withdrawn_whole)
    | test(=dims::leaders::tests::refined_slot_radius_leaders_point_towards_the_arc_centre)
    | test(=repeated_dimensions::an_authored_location_and_rung_with_equal_bands_share_the_authored_survivor)
    | test(=oriented_chamfers::bounded_notches_reserve_acute_arcs_and_leave_dense_general_profiles_alone)
    | test(=oriented_chamfers::notch_dimensions_accept_omit_tolerance_place_and_label_text)
    | test(=gdt_band::stc09_without_a_complete_fit_keeps_its_first_drawing_and_reports_the_floor)
'''
priority = 60

# Exclusive latency gates wait for every running test to finish, idling the other slots, so
# they run first, before any other test has started. CI's shards rank the other tests by
# recorded duration (tools/test_shards.py --priorities); this `ci` override comes first.
[[profile.default.overrides]]
filter = 'test(=r5_multi_sheet_latency) | (binary(=session) & test(_benchmark_deltas))'
priority = 100

[[profile.ci.overrides]]
filter = 'test(=r5_multi_sheet_latency) | (binary(=session) & test(_benchmark_deltas))'
priority = 100
