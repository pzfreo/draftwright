name: Annotation layout cost evidence

on:
  workflow_dispatch:
    inputs:
      cohort:
        description: Cost cohort (fixed15 is the existing default)
        type: choice
        options: [fixed15, ftc09]
        default: fixed15
      measurement:
        description: Candidate-only observation or explicit offline pair
        type: choice
        options: [candidate-only, paired]
        default: candidate-only
  pull_request:
    types: [labeled]

# This runs only by manual dispatch or when a maintainer adds the
# annotation-layout-cost or annotation-layout-cost-ftc09 label to a PR.
# The CAD cases are expensive on macOS and Windows; ordinary PR updates must
# not rerun them. FTC-09 is a distinct public real part, not large user CAD.
# Cost evidence is not a substitute for semantic or safety admission.
permissions:
  contents: read

jobs:
  candidate-first-cost:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'annotation-layout-cost' || github.event.label.name == 'annotation-layout-cost-ftc09'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          # A pull_request event normally checks out its synthetic merge commit.
          # Cost evidence must identify the exact stacked source head instead.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install pinned development dependencies
        run: uv sync --group dev --locked
      - name: Select allowlisted cost cohort
        id: cohort
        shell: bash
        env:
          REQUESTED_COHORT: ${{ inputs.cohort }}
          REQUESTED_MEASUREMENT: ${{ inputs.measurement }}
          PR_LABEL: ${{ github.event.label.name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            cohort="$REQUESTED_COHORT"
            measurement="$REQUESTED_MEASUREMENT"
          elif [ "$PR_LABEL" = annotation-layout-cost-ftc09 ]; then
            cohort=ftc09
            measurement=paired
          else
            cohort=fixed15
            measurement=paired
          fi
          case "$cohort" in
            fixed15) manifest=tests/fixtures/annotation-layout-corpus-v2.json ;;
            ftc09) manifest=tests/fixtures/annotation-layout-holdout-ftc09-v1.json ;;
            *) echo "Unsupported cost cohort: $cohort" >&2; exit 2 ;;
          esac
          case "$measurement" in
            candidate-only|paired) ;;
            *) echo "Unsupported cost measurement: $measurement" >&2; exit 2 ;;
          esac
          printf 'cohort=%s\n' "$cohort" >> "$GITHUB_OUTPUT"
          printf 'measurement=%s\n' "$measurement" >> "$GITHUB_OUTPUT"
          printf 'LAYOUT_COST_COHORT=%s\n' "$cohort" >> "$GITHUB_ENV"
          printf 'LAYOUT_COST_MANIFEST=%s\n' "$manifest" >> "$GITHUB_ENV"
          printf 'LAYOUT_COST_MEASUREMENT=%s\n' "$measurement" >> "$GITHUB_ENV"
      - name: Record source provenance before CAD work
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from hashlib import sha256
          from pathlib import Path

          manifest = Path(os.environ["LAYOUT_COST_MANIFEST"])
          # Windows checkout may rewrite text line endings. Hash the committed
          # manifest blob so provenance is comparable across all three runners.
          manifest_blob = subprocess.check_output(
              ["git", "show", f"HEAD:{manifest.as_posix()}"]
          )
          Path("layout-cost-provenance.json").write_text(json.dumps({
              "source_sha": subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True
              ).strip(),
              "source_ref": os.environ["GITHUB_REF"],
              "event_sha": os.environ["GITHUB_SHA"],
              "event_name": os.environ["GITHUB_EVENT_NAME"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "runner_os": os.environ["RUNNER_OS"],
              "cohort": os.environ["LAYOUT_COST_COHORT"],
              "measurement": os.environ["LAYOUT_COST_MEASUREMENT"],
              "manifest": str(manifest),
              "manifest_sha256": sha256(manifest_blob).hexdigest(),
          }, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Measure candidate-first and offline baseline workers
        if: steps.cohort.outputs.measurement == 'paired'
        shell: bash
        run: |
          echo "source_sha=$(git rev-parse HEAD) cohort=$LAYOUT_COST_COHORT"
          uv run --no-sync python scripts/annotation-scheme-corpus \
            --manifest "$LAYOUT_COST_MANIFEST" \
            --output layout-cost-cases --candidate-first --jobs 1 \
            --worker-timeout-seconds 900 \
            > layout-cost-report.json
          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(Path("layout-cost-report.json").read_text(encoding="utf-8"))["summary"]
          print(json.dumps({
              "wins": summary["verified_wins"],
              "parity": summary["semantic_parity"],
              "candidate_cost": summary["cost"],
          }, indent=2))
          PY
      - name: Measure one-build candidate workers only
        if: steps.cohort.outputs.measurement == 'candidate-only'
        shell: bash
        run: |
          echo "source_sha=$(git rev-parse HEAD) cohort=$LAYOUT_COST_COHORT measurement=candidate-only"
          uv run --no-sync python scripts/annotation-scheme-corpus \
            --manifest "$LAYOUT_COST_MANIFEST" \
            --output layout-cost-cases --candidate-only --jobs 1 \
            --worker-timeout-seconds 900 \
            > layout-cost-report.json
          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(Path("layout-cost-report.json").read_text(encoding="utf-8"))["summary"]
          print(json.dumps({
              "rendered_candidate": summary["rendered_candidate"],
              "failed_candidate": summary["failed_candidate"],
              "candidate_cost": summary["cost"],
          }, indent=2))
          PY
      - name: Keep the machine- and case-level evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: annotation-layout-cost-${{ steps.cohort.outputs.cohort }}-${{ steps.cohort.outputs.measurement }}-${{ matrix.os }}
          path: |
            layout-cost-report.json
            layout-cost-provenance.json
            layout-cost-cases/case-reports/*.json
            layout-cost-cases/*.svg
          if-no-files-found: warn
          retention-days: 30
