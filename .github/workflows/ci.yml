name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels its superseded run. Every other run (each push
# to main, each dispatch) has a group of its own: GitHub cancels a group's *pending* run when a
# newer one queues even without cancel-in-progress, so a shared main group could skip a commit.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "8"
  RUST_TEST_THREADS: "8"
  DRAFTWRIGHT_CORPUS: ${{ github.workspace }}/quiddity/tests/corpus
  DRAFTWRIGHT_CORPUS_REQUIRED: "1"

# fmt and clippy run beside the build; the build compiles every test binary once into a nextest
# archive, and the archive's tests run in parallel jobs. Every test of `cargo test --release`
# runs in exactly one of them (doc-tests, which nextest does not run, run in the build job).
# The acceptance jobs need only the release executable, which the `binary` job builds in
# about half the build's time, so they start before the test binaries are linked.
jobs:
  # A pull request that changes only release metadata (versions, notes) runs lint alone;
  # tools/release_only.py says what counts. A push to main that changes only release metadata
  # runs lint alone too, but only when CI already passed on the commit it was pushed onto, so
  # the code it carries is code a full run has passed. Every other push runs every job.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      release_only: ${{ steps.check.outputs.release_only || steps.push.outputs.release_only }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - id: check
        if: github.event_name == 'pull_request'
        run: python3 -I tools/release_only.py ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}
      - id: push
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$BEFORE&event=push&status=success" --jq '.total_count' || echo 0)
          if [ "$passed" -gt 0 ]; then
            python3 -I tools/release_only.py "$BEFORE" "$AFTER"
          else
            echo "CI has not passed on $BEFORE; running every job"
          fi

  lint:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # The corpus lives in the Python quiddity repository, pinned to a commit whose files match
      # the sha256 bindings of the recorded sheet facts and recognition fixtures.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: pzfreo/quiddity-python
          ref: 6d544e060cd0eeb4442d2196e5df757b5a15ea55
          path: quiddity
          sparse-checkout: tests/corpus
      # The toolchain comes from rust-toolchain.toml.
      - run: rustup toolchain install
      # Caches ~/.cargo (registry and the git checkout of haecceity) and target/: clippy's
      # and the release executable's (the key names a cache that holds both).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: warm
      - run: python3 tools/check_test_binaries.py
      - run: python3 -m unittest discover -s tools -p 'test_check_test_binaries.py'
      - run: cargo fmt --all --check
      # The native analysis and default plan of each of the 66 survey parts, made once by this
      # commit's executable, for the test shards to read instead of making them again
      # (src/plan_cache.rs). Here rather than in `binary`, so the acceptance jobs do not wait.
      - if: needs.changes.outputs.release_only != 'true'
        run: |
          cargo build --release --locked --bin draftwright
          python3 -I tools/warm_plan_cache.py --binary target/release/draftwright --corpus "$DRAFTWRIGHT_CORPUS" --cache plan-cache --inputs target/warm-inputs
      - if: needs.changes.outputs.release_only != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plan-cache
          path: plan-cache/*.json
          if-no-files-found: error
          retention-days: 1
      - run: cargo clippy --workspace --all-targets --release -- -D warnings

  build:
    needs: changes
    if: needs.changes.outputs.release_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: pzfreo/quiddity-python
          ref: 6d544e060cd0eeb4442d2196e5df757b5a15ea55
          path: quiddity
          sparse-checkout: tests/corpus
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: nextest@0.9.146
      # Test targets only: `cargo test`'s default would also link every example, which no test
      # runs (lint's clippy --all-targets still compiles them).
      - run: cargo nextest archive --release --lib --bins --tests --archive-file nextest-archive.tar.zst
      - run: cargo test --doc --release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nextest-archive
          path: nextest-archive.tar.zst
          retention-days: 1

  # The release executable alone (the library and the `draftwright` binary, the same profile
  # and features as the archive's CARGO_BIN_EXE_draftwright), with this job's pinned corpus,
  # for every acceptance job.
  binary:
    needs: changes
    if: needs.changes.outputs.release_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: pzfreo/quiddity-python
          ref: 6d544e060cd0eeb4442d2196e5df757b5a15ea55
          path: quiddity
          sparse-checkout: tests/corpus
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --release --locked --bin draftwright
      - run: |
          test -x target/release/draftwright
          tar -czf acceptance-inputs.tar.gz target/release/draftwright quiddity/tests/corpus
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acceptance-inputs
          path: acceptance-inputs.tar.gz
          retention-days: 1

  test:
    needs: [build, lint]
    # The plan cache only saves work: a lint failure leaves it out, never the tests.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      # The session benchmarks' native p90 <= 150 ms bound is a go/no-go gate measured on the
      # development machine and enforced locally by `cargo test --release`; hosted runners are
      # about five times slower, so here the benchmarks print SESSION_LATENCY without asserting
      # it. Every other session assertion still runs.
      DRAFTWRIGHT_LATENCY_GATE: "0"
      # tests/common/cache.rs reads and writes native analyses and default plans here: lint's
      # for the survey parts, and each one a test of the shard makes for the others.
      DRAFTWRIGHT_TEST_PLAN_CACHE: ${{ github.workspace }}/../plan-cache
    strategy:
      fail-fast: false
      matrix:
        # Ten duration-balanced shards of the `ci` profile's tests (tools/test_shards.py),
        # and the binaries it leaves out run whole under their own harness
        # (.config/nextest.toml says why).
        shard: [1/10, 2/10, 3/10, 4/10, 5/10, 6/10, 7/10, 8/10, 9/10, 10/10, harness]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: pzfreo/quiddity-python
          ref: 6d544e060cd0eeb4442d2196e5df757b5a15ea55
          path: quiddity
          sparse-checkout: tests/corpus
      - run: rustup toolchain install
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: nextest@0.9.146
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nextest-archive
      # The binaries carry the build job's absolute paths (CARGO_MANIFEST_DIR, CARGO_BIN_EXE_*,
      # CARGO_TARGET_TMPDIR), which are this job's too: the archive's target/ is extracted over
      # the workspace, and target/tmp, which cargo makes when it builds, is made here.
      - run: tar --zstd -xf nextest-archive.tar.zst && mkdir -p target/tmp
      # By pattern, which matches nothing rather than failing when lint stopped before it.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: plan-cache
          merge-multiple: true
          path: ${{ env.DRAFTWRIGHT_TEST_PLAN_CACHE }}
      - if: matrix.shard != 'harness'
        shell: bash
        run: |
          cargo nextest list --archive-file nextest-archive.tar.zst \
            --workspace-remap . --profile ci --message-format json > nextest-list.json
          filter=$(python3 -I tools/test_shards.py --list nextest-list.json --shard ${{ matrix.shard }} \
            --priorities "$PWD/shard-priorities.toml")
          cargo nextest run --archive-file nextest-archive.tar.zst \
            --tool-config-file "test-shards:$PWD/shard-priorities.toml" \
            --workspace-remap . --extract-to . --extract-overwrite --profile ci -E "$filter"
          # Every test assigned to this shard ran (the filterset names each one once).
          expected=$(grep -o 'test(=' <<<"$filter" | wc -l)
          ran=$(grep -o '<testcase ' target/nextest/ci/junit.xml | wc -l)
          if [ "$expected" != "$ran" ]; then
            echo "::error::shard ${{ matrix.shard }} was assigned $expected tests but ran $ran"
            exit 1
          fi
      # An entry that does not read back identically is never stored, so it is made afresh
      # each time it is asked for (src/plan_cache.rs): say so.
      - if: always()
        shell: bash
        run: |
          for note in "$DRAFTWRIGHT_TEST_PLAN_CACHE"/*.refused; do
            [ -e "$note" ] && echo "::warning::plan cache refused $(basename "$note"): $(head -c 400 "$note")"
          done
          true
      # Durations for refreshing tools/test-durations.json (tools/test_shards.py --record).
      - if: always() && matrix.shard != 'harness'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-junit-${{ strategy.job-index }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: warn
          retention-days: 14
      # The binaries the `ci` profile's default filter leaves out, each run whole (`shell: bash`
      # adds pipefail).
      - if: matrix.shard == 'harness'
        shell: bash
        run: |
          cargo nextest list --archive-file nextest-archive.tar.zst \
            --workspace-remap . --ignore-default-filter --message-format json > nextest-list.json
          python3 tools/check_test_binaries.py --nextest-list nextest-list.json
          left_out=$(cargo nextest list --archive-file nextest-archive.tar.zst \
            --workspace-remap . --profile ci --ignore-default-filter -E 'not default()' \
            --message-format oneline --color never | awk '{print $1}' | sort -u | sed 's/^draftwright:://')
          if [ -z "$left_out" ]; then
            echo "::error::the ci profile leaves no binary out; this job has nothing to run"
            exit 1
          fi
          for name in $left_out; do
            bin=(target/release/deps/$name-*)
            if [ ${#bin[@]} != 1 ] || [ ! -x "${bin[0]}" ]; then
              echo "::error::the archive does not hold exactly one $name test binary"
              exit 1
            fi
            "${bin[0]}"
          done

  # The quality-pins measurements (30 parts unpinned, the 270 runs of the nine random-pin
  # cells, the AP242 CTC/FTC sources, and the rest of the 66-part repeated-span survey) run
  # once each, balanced across these shards (tools/ci_acceptance.py shard_tasks).
  # quality-gate compares them with one same-binary baseline, enforces every cell, and
  # requires no repeated span on any survey part.
  quality-pins:
    name: acceptance (quality-pins-${{ matrix.shard }}-4)
    needs: binary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: acceptance-inputs
      - run: tar -xzf acceptance-inputs.tar.gz
      # render, plan, review and analyse of one part analyse it once and plan each Spec once,
      # and the shard's tasks share each part's unpinned plan (src/plan_cache.rs).
      - run: python3 -I tools/ci_acceptance.py --job quality-pins --shard ${{ matrix.shard }}/4 --out target/acceptance
        env:
          DRAFTWRIGHT_PLAN_CACHE: ${{ github.workspace }}/plan-cache
      - if: always()
        shell: bash
        run: |
          for note in plan-cache/*.refused; do
            [ -e "$note" ] && echo "::warning::plan cache refused $(basename "$note"): $(head -c 400 "$note")"
          done
          true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: acceptance-quality-pins-${{ matrix.shard }}-4
          path: target/acceptance/
          if-no-files-found: error
          retention-days: 14
      # What quality-gate reads: the shard's results and the unpinned and AP242 drawings.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: quality-gate-input-${{ matrix.shard }}-4
          path: |
            target/acceptance/quality-pins/shard.json
            target/acceptance/quality-pins/quality/
            target/acceptance/quality-pins/ap242/*.plan.json
          if-no-files-found: error
          retention-days: 1

  quality-gate:
    name: acceptance (quality-gate)
    needs: [binary, quality-pins]
    # Compare whatever the shards measured, even when one of them failed; a missing shard
    # fails the gate.
    if: ${{ !cancelled() && needs.binary.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: acceptance-inputs
      - run: tar -xzf acceptance-inputs.tar.gz
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: quality-gate-input-*
          path: target/shards
      - run: python3 -I tools/ci_acceptance.py --job quality-gate --require-go --shards-dir target/shards --out target/acceptance
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: acceptance-quality-gate
          path: target/acceptance/
          if-no-files-found: error
          retention-days: 14

  acceptance:
    name: acceptance (${{ matrix.label }})
    needs: binary
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each budget runs alone in turn: plan-time, then the slow tail's renders
          # (cgb243 and threaded_connector_109, #43 item 3), then the MCP evaluation.
          - {job: budgets, label: budgets, pin_args: "--job plan-time --job render-tail --job mcp", timeout: 70}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: matrix.job == 'budgets'
        with:
          node-version: '22'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: acceptance-inputs
      - run: tar -xzf acceptance-inputs.tar.gz
      - run: python3 -I tools/ci_acceptance.py ${{ matrix.pin_args }} --out target/acceptance
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: acceptance-${{ matrix.label }}
          path: target/acceptance/
          if-no-files-found: error
          retention-days: 14

  wasm:
    name: Browser WASM and native parity
    needs: changes
    if: needs.changes.outputs.release_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0 # Compare API/changelog with the PR base or previous main push.
      - run: python3 -m unittest discover -s tools -p 'test_wasm_safeguards.py'
      - name: Compare released quiddity pins (warning only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/check_quiddity_pin.py
      - run: rustup toolchain install && rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: wasm
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: wasm-pack@0.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: wasm-pack build crates/draftwright-wasm --target web --profile wasm-release --locked
      - name: Check reviewed WASM API
        env:
          API_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: python3 tools/check_wasm_api.py --base-ref "$API_BASE_REF"
      - run: cargo build --locked --release --example wasm_reference
      - run: node --test tools/wasm-parity.test.mjs
      - run: python3 tools/wasm_size.py crates/draftwright-wasm/pkg/draftwright_wasm_bg.wasm
