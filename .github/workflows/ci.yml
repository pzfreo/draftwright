name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly full cross-platform sweep. See the `test` matrix comment for why the
    # per-PR matrix is Linux-only.
    - cron: "17 4 * * 6"
  workflow_dispatch:
    inputs:
      post_release_bump:
        description: Run one canonical coverage suite for an automated post-release version PR
        required: false
        default: false
        type: boolean
      post_release_pr_number:
        description: PR number receiving Codecov patch/project statuses for the version bump
        required: false
        type: string

# A PR needs results only for its latest head. Each main push gets a unique group because it
# owns a post-merge slow-suite run that must survive later merges.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Static preflight
        run: scripts/pr-check --static

  test:
    # The PR is the compatibility gate. A merge to protected main has already passed these
    # exact checks, so main keeps lint + the slow post-merge safety net without repeating them.
    if: github.event_name != 'push' && !inputs.post_release_bump
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # 3.10-3.12 resolve build123d 0.10 (cadquery-ocp + VTK); 3.13/3.14 resolve build123d
        # 0.11 (cadquery-ocp-novtk — VTK dropped, and the only kernel with 3.13/3.14 wheels).
        # Linux covers every supported Python (3.13 is the coverage job below).
        #
        # Non-Linux runners meter far above their wall clock — macOS at 10x, Windows at 2x.
        # Measured on run 31570091735, the four non-Linux jobs were 43 of 100 wall-clock
        # minutes but 236 of 294 billed minutes: 80% of the cost. At the observed rate of
        # roughly 234 pull-request CI runs a month that is ~55,000 billed minutes, and it
        # exhausted the account's Actions allowance.
        #
        # So pull requests run the fast tier on Linux only, plus the smoke+unit
        # `test-platform-canary` legs below (one macOS, one Windows — full tier was
        # tried on 2026-08-19 and rolled back the same day on cost/latency). The full
        # cross-platform surface runs in the weekly sweep, on `workflow_dispatch`, or
        # on any PR carrying the `full-matrix` label — the one to use for a branch
        # touching packaging or kernel resolution. The sweep costs ~1,265 billed
        # minutes a month against the ~55,000 the trim saves.
        #
        # One matrix widened by expression rather than a second job: a duplicate job would
        # repeat every step below and the two copies would drift.
        # PR (Linux-only) jobs are additionally split in two shards via pytest-split
        # (#656): each shard runs half the suite (balanced by the committed
        # .test_durations), roughly halving the PR wall-clock at ~1x metering. The
        # full-matrix sweep entries carry no `shard` key and run unsharded — sharding
        # the 10x-metered macOS jobs would double their setup cost for no billed gain.
        include: ${{ fromJSON(
          (github.event_name == 'pull_request'
            && !contains(github.event.pull_request.labels.*.name, 'full-matrix'))
          && '[{"os":"ubuntu-latest","python-version":"3.10","shard":1},
               {"os":"ubuntu-latest","python-version":"3.10","shard":2},
               {"os":"ubuntu-latest","python-version":"3.11","shard":1},
               {"os":"ubuntu-latest","python-version":"3.11","shard":2},
               {"os":"ubuntu-latest","python-version":"3.12","shard":1},
               {"os":"ubuntu-latest","python-version":"3.12","shard":2},
               {"os":"ubuntu-latest","python-version":"3.14","shard":1},
               {"os":"ubuntu-latest","python-version":"3.14","shard":2}]'
          || '[{"os":"ubuntu-latest","python-version":"3.10"},
                {"os":"ubuntu-latest","python-version":"3.11"},
                {"os":"ubuntu-latest","python-version":"3.12"},
                {"os":"ubuntu-latest","python-version":"3.14"},
                {"os":"macos-latest","python-version":"3.12"},
                {"os":"macos-latest","python-version":"3.14"},
                {"os":"windows-latest","python-version":"3.12"},
                {"os":"windows-latest","python-version":"3.14"}]' ) }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests
        # Fast tier only — the `slow` marker (heavy CTC fixture builds) is
        # deselected by default via addopts. The slow tier runs post-merge in the
        # `test-slow` job below.
        # `-n auto --dist loadscope`: run across all cores (#153). The suite is
        # build-bound and parallel-safe; loadscope keeps a class/module on one
        # worker so test ordering and module-scoped fixtures hold.
        # No --timeout here: it would override the 300 s set in
        # [tool.pytest.ini_options]. The heaviest test (full specimen-sheet SVG
        # export) can exceed 120 s on the slower macOS runners.
        # Coverage is measured only by the Ubuntu/Python 3.13 `coverage` shards below.
        # Instrumenting all fourteen compatibility jobs adds ~13% runtime without
        # producing another retained or uploaded report.
        # `--splits/--group` (pytest-split) apply only when the matrix entry carries a
        # shard; balance comes from the committed .test_durations (regenerate with
        # `--store-durations` when it drifts far from reality — stale entries only
        # unbalance the halves, never drop tests).
        run: >-
          uv run pytest tests/ -n auto --dist loadscope
          --durations=25
          ${{ matrix.shard && format('--splits 2 --group {0}', matrix.shard) || '' }}

  coverage:
    if: github.event_name == 'pull_request' || inputs.post_release_bump
    # The Python 3.13 compatibility entry, which also carries coverage. Unsharded it
    # was the pull request's critical path: measured on run 34078991086 it took 63
    # minutes while the slowest sharded compatibility leg took 42, so every PR waited
    # on this one job well after the rest of the matrix had gone green.
    # Sharded the same way as the `test` matrix, it costs the same billed minutes and
    # halves that wait. Coverage MEASUREMENT is per shard; the reports and the single
    # Codecov upload belong to `coverage-report`, which combines the two data files —
    # so `fail_under` is still applied once, to the whole suite, exactly as before.
    name: test (ubuntu-latest, 3.13, ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Measure coverage for this shard
        env:
          # A name without the leading dot: `actions/upload-artifact` skips hidden files
          # unless told otherwise, and `coverage combine` takes explicit paths anyway.
          COVERAGE_FILE: coverage-data-${{ matrix.shard }}
        # `--cov-report=` renders nothing here and `--cov-fail-under=0` disables the
        # pyproject floor for the shard: half the suite legitimately covers less than
        # 90%, and the real gate runs on the combined data in `coverage-report`.
        run: >-
          uv run pytest tests/ -n auto --dist loadscope
          --splits 2 --group ${{ matrix.shard }}
          --cov=src/draftwright
          --cov-report=
          --cov-fail-under=0
          --durations=25

      - name: Upload this shard's coverage data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-data-${{ matrix.shard }}
          path: coverage-data-${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 1

  coverage-report:
    # The canonical reports and the ONE Codecov upload, over both shards combined.
    # Kept a separate job so only it needs an OIDC token, and so Codecov receives a
    # single complete upload rather than two partial ones racing to compute a status.
    if: github.event_name == 'pull_request' || inputs.post_release_bump
    needs: coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Authenticate the single canonical Codecov upload without a secret.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --group dev

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: coverage-data-*
          merge-multiple: true

      - name: Combine the shards and render the canonical reports
        # `relative_files = true` (pyproject) anchors both shards' paths at the repository
        # root, so the two data files combine without runner-specific rewriting.
        # `coverage report` is what applies `fail_under = 90`, now over the whole suite.
        run: |
          uv run coverage combine coverage-data-1 coverage-data-2
          uv run coverage report --show-missing
          uv run coverage xml
          uv run coverage html -d htmlcov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          files: coverage.xml
          # Branch protection requires Codecov's project and patch checks. Fail this
          # job too when the upload cannot produce those checks, rather than hanging.
          fail_ci_if_error: true
          override_pr: ${{ inputs.post_release_pr_number || github.event.pull_request.number }}
          use_oidc: true

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-linux-py3.13
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: warn
          retention-days: 14

  test-real-part-canary:
    # One real STEP build checks fixed occurrence/measurement expectations and exports
    # before merge (#827). Linux/Python 3.12 matches the post-merge slow-suite kernel;
    # the compatibility matrix covers the other supported Python/kernel resolutions.
    # Run once, outside that matrix. The test has a 120 s execution budget; this
    # job limit also bounds installation and a native-kernel hang.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --group dev
      - name: Check real-part semantics and production exports
        run: uv run pytest tests/test_issue_827_real_part_canary.py -m real_part_canary -v -s --durations=1

  test-slow:
    # Heavy end-to-end CTC fixture builds (minutes each); run once, not across
    # the full OS/Python matrix.
    #
    # POST-MERGE ONLY — runs on push to main, not on pull_request, so it no
    # longer gates PR merge (#153). Rationale: since #149 pinned the fonts,
    # generated layout is deterministic, so these heavy real-part standards builds
    # rarely catch anything the PR fast tier misses. They stay as a safety net on
    # main; a regression here is caught right after merge.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --group dev
      - name: Run slow tests
        # Slow cases isolate their outputs with tmp_path and carry no cross-test ordering
        # contract. Distribute individual cases: loadscope serialized the 18-case standards
        # module and left most workers idle (#1108).
        run: uv run pytest tests/ -m slow -n auto --dist load

  test-platform-canary:
    # One macOS and one Windows leg on every PR, restored at smoke+unit scope: the
    # curated build-light subset plus the pure-logic tier (~1 min of tests) surfaces
    # packaging and kernel-resolution breaks off-Linux before merge. The pair covers
    # both kernel resolutions (3.12 -> build123d 0.10, 3.14 -> 0.11). Deliberately NOT
    # the full fast tier: non-Linux meters at 10x (macOS) / 2x (Windows), and full
    # per-PR legs are what exhausted the Actions allowance (see the matrix comment
    # above) — the full non-Linux surface stays on the weekly sweep and the
    # `full-matrix` label.
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.12"
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --group dev
      - name: Run smoke + unit tiers
        run: uv run pytest tests/ -m "smoke or unit" -n auto --dist loadscope

  ci-ok:
    # The single status check branch protection should require.
    #
    # Protection currently names each matrix leg individually — `test (macos-latest, 3.12)`
    # and nine others. A required context that names a job is only satisfied when a job of
    # that exact name reports, so changing the matrix at all leaves those contexts stuck on
    # "Expected" and makes every pull request permanently unmergeable. Requiring this job
    # instead lets the matrix change shape without touching repository settings.
    #
    # `if: always()` is load-bearing, not decoration. Without it a failing dependency
    # skips this job, and GitHub counts a skipped required check as satisfied — so a
    # broken test suite would report a green gate.
    if: always()
    needs:
      - lint
      - test
      - coverage
      - coverage-report
      - test-slow
      - test-platform-canary
      - test-real-part-canary
    runs-on: ubuntu-latest
    permissions:
      statuses: write # Attach the dispatched post-release gate to its generated PR head.
    steps:
      - name: Require every gating job to have succeeded or been legitimately skipped
        env:
          EVENT_NAME: ${{ github.event_name }}
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
          COVERAGE: ${{ needs.coverage.result }}
          COVERAGE_REPORT: ${{ needs.coverage-report.result }}
          SLOW: ${{ needs.test-slow.result }}
          CANARY: ${{ needs.test-platform-canary.result }}
          REAL_PART: ${{ needs.test-real-part-canary.result }}
        run: |
          echo "lint=$LINT test=$TEST coverage=$COVERAGE report=$COVERAGE_REPORT" \
               "slow=$SLOW canary=$CANARY real-part=$REAL_PART"
          failed=0
          for pair in "lint:$LINT" "test:$TEST" "coverage:$COVERAGE" \
                      "coverage-report:$COVERAGE_REPORT" "canary:$CANARY"; do
            name=${pair%%:*}
            result=${pair#*:}
            # `skipped` is a pass: `test` does not run on push and `coverage` runs only on
            # pull_request, by design. `failure` and `cancelled` are not passes.
            case "$result" in
              success|skipped) ;;
              *) echo "::error::$name did not pass (result: $result)"; failed=1 ;;
            esac
          done

          # The slow suite is deliberately post-merge only. On a push to main it is a
          # required result, while every other trigger must see the conditional job as
          # skipped. Keeping it out of the generic success-or-skipped loop prevents a
          # skipped or failed main slow suite from being reported as a green aggregate.
          if [[ "$EVENT_NAME" == "push" ]]; then
            if [[ "$SLOW" != "success" ]]; then
              echo "::error::slow did not pass on main (result: $SLOW)"
              failed=1
            fi
          elif [[ "$SLOW" != "skipped" ]]; then
            echo "::error::slow ran unexpectedly for $EVENT_NAME (result: $SLOW)"
            failed=1
          fi
          # A skipped PR canary must not silently satisfy this required check.
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ "$REAL_PART" != "success" ]]; then
              echo "::error::real-part canary did not pass (result: $REAL_PART)"
              failed=1
            fi
          elif [[ "$REAL_PART" != "skipped" ]]; then
            echo "::error::real-part canary ran unexpectedly for $EVENT_NAME (result: $REAL_PART)"
            failed=1
          fi
          exit $failed

      - name: Attach successful post-release gate to the generated PR head
        if: inputs.post_release_bump
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          gh api --method POST
          "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
          -f state=success
          -f context=ci-ok
          -f description="Post-release CI passed"
          -f target_url="$TARGET_URL"
