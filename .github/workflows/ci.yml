name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly full cross-platform sweep. See the `test` matrix comment for why the
    # per-PR matrix is Linux-only.
    - cron: "17 4 * * 6"
  workflow_dispatch:
    inputs:
      maintenance_bump:
        description: Run one canonical coverage suite for an automation-only version/dependency PR
        required: false
        default: false
        type: boolean
      maintenance_pr_number:
        description: PR number receiving Codecov patch/project statuses for a maintenance bump
        required: false
        type: string

# A PR needs results only for its latest head. Each main push gets a unique group because it
# owns a post-merge slow-suite run that must survive later merges.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Static preflight
        run: scripts/pr-check --static

  test:
    # The PR is the compatibility gate. A merge to protected main has already passed these
    # exact checks, so main keeps lint + the slow post-merge safety net without repeating them.
    if: github.event_name != 'push' && !inputs.maintenance_bump
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # 3.10-3.12 resolve build123d 0.10 (cadquery-ocp + VTK); 3.13/3.14 resolve build123d
        # 0.11 (cadquery-ocp-novtk — VTK dropped, and the only kernel with 3.13/3.14 wheels).
        # Linux covers every supported Python (3.13 is the coverage job below).
        #
        # Non-Linux runners meter far above their wall clock — macOS at 10x, Windows at 2x.
        # Measured on run 31570091735, the four non-Linux jobs were 43 of 100 wall-clock
        # minutes but 236 of 294 billed minutes: 80% of the cost. At the observed rate of
        # roughly 234 pull-request CI runs a month that is ~55,000 billed minutes, and it
        # exhausted the account's Actions allowance.
        #
        # So pull requests run Linux only, and the full cross-platform surface runs in the
        # weekly sweep, on `workflow_dispatch`, or on any PR carrying the `full-matrix`
        # label — which is the one to use for a branch touching packaging or kernel
        # resolution. The sweep costs ~1,265 billed minutes a month against the ~55,000
        # the trim saves.
        #
        # One matrix widened by expression rather than a second job: a duplicate job would
        # repeat every step below and the two copies would drift.
        include: ${{ fromJSON(
          (github.event_name == 'pull_request'
            && !contains(github.event.pull_request.labels.*.name, 'full-matrix'))
          && '[{"os":"ubuntu-latest","python-version":"3.10"},
               {"os":"ubuntu-latest","python-version":"3.11"},
               {"os":"ubuntu-latest","python-version":"3.12"},
               {"os":"ubuntu-latest","python-version":"3.14"}]'
          || '[{"os":"ubuntu-latest","python-version":"3.10"},
                {"os":"ubuntu-latest","python-version":"3.11"},
                {"os":"ubuntu-latest","python-version":"3.12"},
                {"os":"ubuntu-latest","python-version":"3.14"},
                {"os":"macos-latest","python-version":"3.12"},
                {"os":"macos-latest","python-version":"3.14"},
                {"os":"windows-latest","python-version":"3.12"},
                {"os":"windows-latest","python-version":"3.14"}]' ) }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests
        # Fast tier only — the `slow` marker (heavy CTC fixture builds) is
        # deselected by default via addopts. The slow tier runs post-merge in the
        # `test-slow` job below.
        # `-n auto --dist loadscope`: run across all cores (#153). The suite is
        # build-bound and parallel-safe; loadscope keeps a class/module on one
        # worker so test ordering and module-scoped fixtures hold.
        # No --timeout here: it would override the 300 s set in
        # [tool.pytest.ini_options]. The heaviest test (full specimen-sheet SVG
        # export) can exceed 120 s on the slower macOS runners.
        # Coverage is measured once by the canonical Ubuntu/Python 3.13 job below.
        # Instrumenting all fourteen compatibility jobs adds ~13% runtime without
        # producing another retained or uploaded report.
        run: >-
          uv run pytest tests/ -n auto --dist loadscope
          --durations=25

  coverage:
    if: github.event_name == 'pull_request' || inputs.maintenance_bump
    # The ninth OS/Python compatibility entry, split out so only the one job that
    # uploads to Codecov receives an OIDC token and renders retained reports.
    name: test (ubuntu-latest, 3.13)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Authenticate the single canonical Codecov upload without a secret.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests with canonical coverage reports
        run: >-
          uv run pytest tests/ -n auto --dist loadscope
          --cov=src/draftwright
          --cov-report=term-missing
          --cov-report=xml
          --cov-report=html:htmlcov
          --durations=25

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          files: coverage.xml
          # Branch protection requires Codecov's project and patch checks. Fail this
          # job too when the upload cannot produce those checks, rather than hanging.
          fail_ci_if_error: true
          override_pr: ${{ inputs.maintenance_pr_number || github.event.pull_request.number }}
          use_oidc: true

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-linux-py3.13
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: warn
          retention-days: 14

  test-slow:
    # Heavy end-to-end CTC fixture builds (minutes each); run once, not across
    # the full OS/Python matrix.
    #
    # POST-MERGE ONLY — runs on push to main, not on pull_request, so it no
    # longer gates PR merge (#153). Rationale: since #149 pinned the fonts,
    # generated layout is deterministic, so these heavy real-part standards builds
    # rarely catch anything the PR fast tier misses. They stay as a safety net on
    # main; a regression here is caught right after merge.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --group dev
      - name: Run slow tests
        # Slow cases isolate their outputs with tmp_path and carry no cross-test ordering
        # contract. Distribute individual cases: loadscope serialized the 18-case standards
        # module and left most workers idle (#1108).
        run: uv run pytest tests/ -m slow -n auto --dist load

  ci-ok:
    # The single status check branch protection should require.
    #
    # Protection currently names each matrix leg individually — `test (macos-latest, 3.12)`
    # and nine others. A required context that names a job is only satisfied when a job of
    # that exact name reports, so changing the matrix at all leaves those contexts stuck on
    # "Expected" and makes every pull request permanently unmergeable. Requiring this job
    # instead lets the matrix change shape without touching repository settings.
    #
    # `if: always()` is load-bearing, not decoration. Without it a failing dependency
    # skips this job, and GitHub counts a skipped required check as satisfied — so a
    # broken test suite would report a green gate.
    if: always()
    needs: [lint, test, coverage]
    runs-on: ubuntu-latest
    steps:
      - name: Require every gating job to have succeeded or been legitimately skipped
        env:
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
          COVERAGE: ${{ needs.coverage.result }}
        run: |
          echo "lint=$LINT test=$TEST coverage=$COVERAGE"
          failed=0
          for pair in "lint:$LINT" "test:$TEST" "coverage:$COVERAGE"; do
            name=${pair%%:*}
            result=${pair#*:}
            # `skipped` is a pass: `test` does not run on push and `coverage` runs only on
            # pull_request, by design. `failure` and `cancelled` are not passes.
            case "$result" in
              success|skipped) ;;
              *) echo "::error::$name did not pass (result: $result)"; failed=1 ;;
            esac
          done
          exit $failed
