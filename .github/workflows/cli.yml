name: Release command line

# The draftwright command line for Linux, macOS and Windows, attached to each release. A change to
# this workflow builds and tries all three on its pull request, without attaching anything.
on:
  release:
    types: [published]
  pull_request:
    paths: ['.github/workflows/cli.yml', 'about.toml', 'about.hbs']

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'pull_request' || startsWith(github.event.release.tag_name, 'v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, exe: '' }
          - { os: macos-latest, target: aarch64-apple-darwin, exe: '' }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, exe: .exe }
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      # rustc's thin-LTO threads overflow Windows' default stack on step-io.
      RUST_MIN_STACK: '67108864'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - name: The tag and the pre-release flag agree
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: python3 tools/check_wheel_versions.py --tag "$TAG" --prerelease "$PRERELEASE"
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: cli-${{ matrix.target }}
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: cargo-about@0.9.3
      - name: Third-party licence notices
        run: cargo about generate --locked --workspace --all-features about.hbs -o THIRD-PARTY-LICENSES
      - run: cargo build --locked --release --bin draftwright --bin draftwright-mcp --target ${{ matrix.target }}
      - name: Try it on a revision
        # The hole_removed pair: one entry renumbers with its hole, one is set aside with the
        # removed hole.
        run: |
          bin="target/${{ matrix.target }}/release/draftwright${{ matrix.exe }}"
          "$bin" --help
          "$bin" --version
          fixtures=tests/fixtures/revisions
          echo '{"schema": "draftwright.spec/2", "sheet": {}, "dimensions": {"d:f:hole:3/bore.diameter": {"tolerance": "+0.1 -0"}, "d:f:hole:2/bore.diameter": {"tolerance": "±0.2"}}}' > given.json
          printed=$("$bin" diff $fixtures/hole_removed.old.step.gz $fixtures/hole_removed.new.step.gz --spec given.json -o smoke)
          echo "$printed"
          echo "$printed" | grep -q '"verdict": *"decide"'
          cat smoke/spec.json
          # The ⌀8 hole's tolerance follows it from f:hole:3 to f:hole:2.
          grep -q '"+0.1 -0"' smoke/spec.json && ! grep -q 'f:hole:3' smoke/spec.json
      - name: Package and checksum
        run: |
          name="draftwright-${RELEASE_TAG:-pr}-${{ matrix.target }}"
          mkdir -p dist "$name"
          cp "target/${{ matrix.target }}/release/draftwright${{ matrix.exe }}" LICENSE THIRD-PARTY-LICENSES README.md "$name/"
          cp fonts/LICENSE-*.txt "$name/"
          cp "target/${{ matrix.target }}/release/draftwright-mcp${{ matrix.exe }}" "$name/"
          cp -R schemas "$name/"
          mkdir -p "$name/docs"
          cp docs/model.md docs/mcp.md "$name/docs/"
          cp -R docs/rules "$name/docs/"
          if [ "${{ runner.os }}" = Windows ]; then
            asset="$name.zip"; 7z a -bd "dist/$asset" "$name" > /dev/null
          else
            asset="$name.tar.gz"; tar -czf "dist/$asset" "$name"
          fi
          cd dist
          if command -v sha256sum > /dev/null; then sha256sum "$asset"; else shasum -a 256 "$asset"; fi > "$asset.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # Only this job can write to the repository, and only for a release.
  attach:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true
      - name: Attach to this release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
