name: Release command line

# The draftwright command line for Linux, macOS and Windows, attached to each release. A change to
# this workflow builds and tries every target on its pull request, without attaching anything. A manual
# run builds an existing release tag and attaches to it, for a release whose own run failed.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach the command line to (e.g. v0.6.0-alpha.2)
        required: true
      release_checks_run:
        description: Shared pre-publication run ID or run ID/attempt for a backfill or retry
        type: string
  pull_request:
    paths: ['.github/workflows/cli.yml', '.github/requirements/cli-linux.txt', 'tools/check_glibc_floor.py', 'about.toml', 'about.hbs']

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'pull_request' || startsWith(github.event.release.tag_name || inputs.tag, 'v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, exe: '' }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, exe: '' }
          - { os: macos-latest, target: aarch64-apple-darwin, exe: '' }
          - { os: macos-15-intel, target: x86_64-apple-darwin, exe: '' }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, exe: .exe }
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      # rustc's thin-LTO threads overflow Windows' default stack on step-io.
      RUST_MIN_STACK: '67108864'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.sha }}
      - name: The tag and the pre-release flag agree
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: python3 tools/check_wheel_versions.py --tag "$TAG" --prerelease "$PRERELEASE"
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: cli-${{ matrix.target }}
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        if: matrix.target != 'x86_64-apple-darwin'
        with:
          tool: cargo-about@0.9.3
      - name: Build the Intel macOS licence generator with its CLI
        if: matrix.target == 'x86_64-apple-darwin'
        run: cargo install cargo-about --version 0.9.3 --locked --features cli
      - name: Third-party licence notices
        run: cargo about generate --locked --workspace --all-features about.hbs -o THIRD-PARTY-LICENSES
      # Use the workflow's requirements even when manually backfilling an older tag.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: endsWith(matrix.target, '-linux-gnu')
        with:
          ref: ${{ github.workflow_sha }}
          path: .cli-toolchain
          sparse-checkout: |
            .github/requirements/cli-linux.txt
            tools/check_glibc_floor.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Linux glibc toolchain
        if: endsWith(matrix.target, '-linux-gnu')
        run: |
          rustup target add ${{ matrix.target }}
          python3 -m venv "$RUNNER_TEMP/linux-tools"
          "$RUNNER_TEMP/linux-tools/bin/pip" install --require-hashes -r .cli-toolchain/.github/requirements/cli-linux.txt
          echo "$RUNNER_TEMP/linux-tools/bin" >> "$GITHUB_PATH"
      - run: cargo build --locked --release --bin draftwright --bin draftwright-mcp --target ${{ matrix.target }}
        if: ${{ !endsWith(matrix.target, '-linux-gnu') }}
      - name: Build Linux binaries for glibc 2.17
        if: endsWith(matrix.target, '-linux-gnu')
        # Zig's suffix selects glibc; Cargo's output directory remains the plain triple.
        run: cargo zigbuild --locked --release --bin draftwright --bin draftwright-mcp --target ${{ matrix.target }}.2.17
      - name: Verify both Linux binaries require at most glibc 2.17
        if: endsWith(matrix.target, '-linux-gnu')
        run: |
          python3 .cli-toolchain/tools/check_glibc_floor.py --max-version 2.17 \
            target/${{ matrix.target }}/release/draftwright \
            target/${{ matrix.target }}/release/draftwright-mcp
          target/${{ matrix.target }}/release/draftwright-mcp --version
      - name: Run both Linux binaries and the revision smoke test on old glibc
        if: endsWith(matrix.target, '-linux-gnu')
        # Debian 10 (glibc 2.28) still pulls for amd64 and arm64. No packages or
        # network are needed; the separate symbol check enforces the 2.17 floor.
        run: |
          case '${{ matrix.target }}' in
            aarch64-*) platform=linux/arm64 ;;
            *) platform=linux/amd64 ;;
          esac
          docker run --rm -i --pull always --platform "$platform" --network none --workdir /tmp \
            --mount "type=bind,source=$PWD/target/${{ matrix.target }}/release,target=/binaries,readonly" \
            --mount "type=bind,source=$PWD/tests/fixtures/revisions,target=/fixtures,readonly" \
            debian:10@sha256:58ce6f1271ae1c8a2006ff7d3e54e9874d839f573d8009c20154ad0f2fb0a225 sh -eu <<'SMOKE'
          ldd --version | head -1
          /binaries/draftwright --version
          /binaries/draftwright-mcp --version
          echo '{"schema": "draftwright.spec/2", "sheet": {}, "dimensions": {"d:f:hole:3/bore.diameter": {"tolerance": "+0.1 -0"}, "d:f:hole:2/bore.diameter": {"tolerance": "±0.2"}}}' > given.json
          printed=$(/binaries/draftwright diff /fixtures/hole_removed.old.step.gz /fixtures/hole_removed.new.step.gz --spec given.json -o smoke)
          echo "$printed"
          echo "$printed" | grep -q '"verdict": *"decide"'
          grep -q '"+0.1 -0"' smoke/spec.json
          ! grep -q 'f:hole:3' smoke/spec.json
          SMOKE
      - name: Try it on a revision
        # The hole_removed pair: one entry renumbers with its hole, one is set aside with the
        # removed hole.
        run: |
          bin="target/${{ matrix.target }}/release/draftwright${{ matrix.exe }}"
          "$bin" --help
          "$bin" --version
          fixtures=tests/fixtures/revisions
          echo '{"schema": "draftwright.spec/2", "sheet": {}, "dimensions": {"d:f:hole:3/bore.diameter": {"tolerance": "+0.1 -0"}, "d:f:hole:2/bore.diameter": {"tolerance": "±0.2"}}}' > given.json
          printed=$("$bin" diff $fixtures/hole_removed.old.step.gz $fixtures/hole_removed.new.step.gz --spec given.json -o smoke)
          echo "$printed"
          echo "$printed" | grep -q '"verdict": *"decide"'
          cat smoke/spec.json
          # The ⌀8 hole's tolerance follows it from f:hole:3 to f:hole:2.
          grep -q '"+0.1 -0"' smoke/spec.json && ! grep -q 'f:hole:3' smoke/spec.json
      - name: Package and checksum
        run: |
          name="draftwright-${RELEASE_TAG:-pr}-${{ matrix.target }}"
          mkdir -p dist "$name"
          cp "target/${{ matrix.target }}/release/draftwright${{ matrix.exe }}" LICENSE THIRD-PARTY-LICENSES README.md "$name/"
          cp fonts/LICENSE-*.txt "$name/"
          cp "target/${{ matrix.target }}/release/draftwright-mcp${{ matrix.exe }}" "$name/"
          cp -R schemas "$name/"
          mkdir -p "$name/docs"
          cp docs/model.md docs/mcp.md "$name/docs/"
          cp -R docs/rules "$name/docs/"
          if [ "${{ runner.os }}" = Windows ]; then
            asset="$name.zip"; 7z a -bd "dist/$asset" "$name" > /dev/null
          else
            asset="$name.tar.gz"; tar -czf "dist/$asset" "$name"
          fi
          cd dist
          if command -v sha256sum > /dev/null; then sha256sum "$asset"; else shasum -a 256 "$asset"; fi > "$asset.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # Only this job can write to the repository, and only for a release or a manual run.
  attach:
    needs: build
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true
      # Use the workflow's guard even when backfilling an older release tag.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-ci-guard
          sparse-checkout: tools/check_release_ci.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Require full main CI and the shared release checks
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: python3 .release-ci-guard/tools/check_release_ci.py --tag "$TAG" --require-release-checks
      - name: Attach to this release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
