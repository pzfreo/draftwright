name: Release browser WASM

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach the WASM package to (e.g. v0.2.11)
        required: true

permissions:
  contents: read

jobs:
  wasm:
    if: startsWith(github.event.release.tag_name || inputs.tag, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: "8"
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - name: The tag and the pre-release flag agree
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release event carries the flag; a manual run asks GitHub for the tag's release.
          prerelease="$PRERELEASE"
          if [ -z "$prerelease" ]; then
            prerelease=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .prerelease)
          fi
          python3 tools/check_wheel_versions.py --tag "$TAG" --prerelease "$prerelease"
      - name: Check the tag and package versions agree
        run: |
          python3 - <<'PYTHON'
          import os, tomllib
          version = os.environ["RELEASE_TAG"].removeprefix("v")
          for manifest in ["Cargo.toml", "crates/draftwright-wasm/Cargo.toml"]:
              with open(manifest, "rb") as source:
                  actual = tomllib.load(source)["package"]["version"]
              if actual != version:
                  raise SystemExit(f"{manifest}: {actual} does not match release {version}")
          PYTHON
      - run: rustup toolchain install && rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: wasm
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: wasm-pack@0.15.0
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: cargo-about@0.9.3
      - name: Third-party licence notices
        run: cargo about generate --locked --workspace --all-features about.hbs -o THIRD-PARTY-LICENSES
      - run: wasm-pack build crates/draftwright-wasm --target web --profile wasm-release --locked
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: cargo build --locked --release --example wasm_reference --bin draftwright
      - run: node --test tools/wasm-parity.test.mjs
      - run: python3 tools/wasm_size.py crates/draftwright-wasm/pkg/draftwright_wasm_bg.wasm
      - name: Package and checksum
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          asset="draftwright-wasm-${version}.tgz"
          cp LICENSE THIRD-PARTY-LICENSES fonts/LICENSE-IBMPlexMono-OFL.txt fonts/LICENSE-IBMPlexSansCondensed-OFL.txt crates/draftwright-wasm/pkg/
          tar -czf "$asset" -C crates/draftwright-wasm pkg
          sha256sum "$asset" > "$asset.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wasm-package
          path: |
            draftwright-wasm-*.tgz
            draftwright-wasm-*.tgz.sha256
          if-no-files-found: error

  # Only this job can write to the repository. It builds nothing: it downloads the
  # package, attaches it, and runs the first-party (stdlib-only) pin check.
  attach:
    needs: wasm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wasm-package
          path: dist
      - name: Compare released quiddity pins and annotate release (warning only)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/check_quiddity_pin.py --release "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
      - name: Attach the package to this release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
