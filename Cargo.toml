[package]
name = "draftwright"
version = "0.2.9"
edition = "2024"
autotests = false
license = "AGPL-3.0-only"
description = "Automated technical drawings from STEP B-rep: a Rust port of draftwright."

[dependencies]
chrono = { version = "0.4", default-features = false }
dxf = { version = "0.6.2", features = ["serialize"] }
flate2 = "1.1.10"
haecceity = { git = "https://github.com/pzfreo/quiddity-rust", tag = "v0.4.3" }
pdf-writer = "0.15"
png = "0.18.1"
quiddity = { git = "https://github.com/pzfreo/quiddity-rust", tag = "v0.4.3" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
sha2 = "0.11.0"
subsetter = { version = "0.2.6", default-features = false }
tiny-skia = { version = "0.12.0", default-features = false, features = ["std"] }
ttf-parser = "0.25.1"
uuid = { version = "1", default-features = false }

# dxf's uuid needs a browser random source even when this library is built directly.
[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1", default-features = false, features = ["js"] }
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
syn = { version = "2", features = ["full", "visit"] }
flate2 = "1.1.10"
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }

[build-dependencies]
sha2 = "0.11.0"

[workspace]
members = ["crates/draftwright-wasm"]
default-members = ["."]
resolver = "3"

# Keep the native release build's compile time and behaviour unchanged.
[profile.wasm-release]
inherits = "release"
lto = true
codegen-units = 1
opt-level = 3

# See docs/test-binaries.md; tools/check_test_binaries.py guards module coverage.

[[test]]
name = "core"
path = "tests/core/main.rs"

[[test]]
name = "dimensions"
path = "tests/dimensions/main.rs"

[[test]]
name = "rendering"
path = "tests/rendering/main.rs"

[[test]]
name = "audits"
path = "tests/audits/main.rs"

[[test]]
name = "issue_drafting"
path = "tests/issue_drafting.rs"

[[test]]
name = "issue_trust"
path = "tests/issue_trust.rs"

[[test]]
name = "session"
path = "tests/session.rs"

[[test]]
name = "multi_sheet_latency"
path = "tests/multi_sheet_latency.rs"
