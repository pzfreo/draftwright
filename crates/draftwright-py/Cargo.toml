[package]
name = "draftwright-py"
version = "0.2.15"
edition = "2024"
publish = false
license = "AGPL-3.0-only"
description = "Python bindings for draftwright"

[lib]
name = "_native"
crate-type = ["cdylib"]

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
draftwright = { path = "../.." }
pyo3 = { version = "0.30.1", features = ["abi3-py39"] }
