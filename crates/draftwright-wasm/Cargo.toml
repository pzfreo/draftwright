[package]
name = "draftwright-wasm"
version = "0.6.0-alpha.1"
edition = "2024"
license = "AGPL-3.0-only"
description = "Draftwright's live drawing session for browsers."
repository = "https://github.com/pzfreo/draftwright"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
draftwright = { path = "../..", default-features = false }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
