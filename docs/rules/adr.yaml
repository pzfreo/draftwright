  why: "Rules assessment 2026-10-11: the PAVA strip solve is replaced by the exact joint leader assignment (src/dims/leaders.rs)."
  rust_note: "Not ported as such: the port has no PAVA strip solve; callout rows come from src/dims/leaders.rs's bounded candidate inventory and joint assignment (minimum total leader length after crossings), which is exact within its node budget but not draftwright's strip solver or its tie rule."
  port_note: "Keep: port the PAVA solver with the identical tie rule; property-test crossing-freedom and determinism."

- id: ADR2-6
  statement: "One stage order, two entry paths: a single canonical pass sequence is run by both the automatic build and the edit-drain."
  detail: "_PASS_SEQUENCE run through run_stages by _auto_annotate and finalize(). That it is the only stage tuple is enforced by structure, not mutation (ADR 1 Unguarded)."
