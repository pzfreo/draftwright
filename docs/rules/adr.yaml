- id: ADR2-7
  statement: "Feature leaders are assigned jointly, late and observably; unknown provenance is never silently optional, and a fired work budget is a named capability loss."
  detail: "Lexicographic objective: required jobs, unknown jobs, optional jobs, priority, fixed-obstacle penalty, length, order. Budgets count measured work (prefer counting real work to predicting it; any pre-check must be exact). The class-first greedy result is the floor under every cap (archive 0014 Amendments 1-5)."
  class: drafting
  source:
    adr: "ADR 2 invariant 7; archive 0014 Amendments 1-5"
    issues: [740, 1166, 1188, 1308]
    tests: ["test_issue_1166_cross_pass_feature_leaders.py", "test_issue_740_leader_assignment.py", "test_issue_1188_per_view_assignment.py", "test_issue_1308_machined_leader_analytics.py"]
  status: retired
  rust_test: "src/dims/leaders.rs::tests::the_assignment_matches_an_exhaustive_oracle"
  why: "Rules assessment 2026-10-11: every callout is required and assigned jointly; provenance classes have nothing to choose between."
  rust_note: "Partial: callout leaders are assigned jointly and late (after the dimensions; src/dims/leaders.rs). A fired node budget is the plan problem annotation_leader_search_capped (info) naming the group's callouts. Not ported: provenance classes (every callout is required)."
  port_note: "Keep: joint leader assignment in the planner; a hit budget emits a structured Plan problem naming the lost capability."

- id: ADR2-8
  statement: "Material re-entry is one predicate shared by the leader router and the critique, and it is a cost, never a gate."
  detail: "A leader's first exit from the body is legitimate; a second traversal is a cut. Priced at one unit per visible stroke width of buried shaft, alongside the Policy-B penalty. The material field is built once per build under explicit tessellation control (copy, clean, mesh) so it is not a function of build history (archive 0014 Amendment 3)."
  class: drafting
  source:
    adr: "ADR 2 invariant 8; archive 0014 Amendment 3"
    issues: [798, 1187]
    tests: ["test_issue_798_material_field.py", "test_issue_798_silhouette_lint.py", "test_issue_798_floor_cardinality.py", "test_issue_1187_unroutable_leaders.py"]
  status: ported
  rust_test: "src/material.rs::tests::the_reentry_is_a_magnitude_not_a_flag"
  rust_note: "Stream K4: src/material.rs is the one predicate: material::reentry measures the page length of a shaft inside the material after its exit at the tip, and material::solids builds the material (each solid's projected box). The router (src/dims/leaders.rs, through dims::footprints) and lint's leader_crosses_silhouette (src/lint/leaders.rs) both call it, so they agree on every shaft (tests/leader_rules.rs::the_plan_and_lint_agree_on_a_leader_cutting_back_into_the_material, on a pinned leader cutting across the plate-and-pin assembly). It is a cost: a re-entering candidate counts one hard blocker and adds its depth to its length; nothing is dropped for it. Differences: it outranks crossings (draftwright prices one unit per stroke width beside the Policy-B penalty), and the material is the solids' projected boxes, not a tessellated filled face (the plan is made from the Analysis, ADR R1), so a concave silhouette's notch reads as material."
  port_note: "Keep: one re-entry function used by planner and lint; tessellation must be deterministic in the Rust kernel."

- id: ADR2-9
  statement: "Policy B crossings remain visible: a retained, measured fixed-ink crossing is recorded as a finding with callout and obstruction provenance."
  detail: "feature_leader_crossing; an exhausted fixed-ink probe budget yields feature_leader_fixed_ink_unverified; representative finished sheets are checked for layout defect codes."
  class: trust
  source:
    adr: "ADR 2 invariant 9"
    issues: []
    tests: ["test_issue_1166_cross_pass_feature_leaders.py (test_immediate_producer_floor_records_a_retained_fixed_crossing_issue_2112, test_ownerless_section_centerline_at_the_tip_is_not_a_global_axis_exemption)", "test_layout_cleanliness.py (test_finished_sheet_has_no_layout_collisions)"]
  status: ported
  rust_test: "rendering::leaders::callout_leaders_cross_nothing_unlisted"
  rust_note: "A callout leader kept across another annotation's line is the plan problem annotation_leader_crossing with the callout's and the obstruction's IDs (src/dims/placement.rs::collisions); one through a label is annotation_ink_overlap. There is no fixed-ink probe budget to exhaust (the fixed ink is the plan's own lines, measured exactly), so feature_leader_fixed_ink_unverified has no counterpart. Linear dimension strokes crossing now produce dimension_line_crossing (warning); extension/extension crossings remain allowed. annotation_leader_crossing retains its code, ID, subjects and message and adds crossing_kinds (leader, dimension_line, extension_line, arrow; several kinds per pair). annotation_ink_overlap adds ink_is_leader, true only for a callout line through the label, not a flare-only arrowhead contact. The quality-pins acceptance job ratchets all six categories per part from the recorded origin/main baseline."
  port_note: "Keep: retained crossings and unverified ink become Plan problems referencing the annotation id and the obstruction id."

- id: ADR2-10
  statement: "Same-batch dimension ink is visible before commit and is resolved by a bounded strictly-improving local solve, not a second placement engine."
  detail: "Bounded along-dimension-line label alternatives; pinned candidates immutable. GD&T frames check full glyph+leader against settled and same-batch ink; an infeasible authored frame relocates or reports a named drop rather than overprinting; pitch, step-height and imported PMI dimensions check finished ink; a bounded failed search reports the missing annotation rather than claiming illegible ink as placed."
  class: drafting
  source:
    adr: "ADR 2 invariant 10; archive 0014 Amendment 6"
    issues: [1334]
    tests: ["test_issue_1334_prevent_ink.py", "test_gdt_ink_shared.py", "test_remaining_ink_overlaps.py"]
  status: ported
  rust_test: src/dims/label_lanes.rs::promotion_uses_only_next_lane_preserves_pins_and_is_idempotent
  rust_note: "Partly: dims::placement::settle moves a label off other items' ink by bounded alternatives (a linear label along its own line, a callout's leader turned left about its site), each kept on the sheet and off the views and the title block, and an unresolved overlap stays an annotation_ink_overlap problem (tests/placement.rs ratchets the counts). Callout leaders are assigned jointly with the fewest crossings, then text touched, then ink out of the view's area (src/dims/leaders.rs, ISSUE-740-a); a linear label still takes the first clear place, item by item in plan order (a fewest-conflicts fallback along its line was tried in stream d-quality-ink and changed nothing on the 30 quality parts, so it was not kept). Missing: pinned candidates (no nudges in the spec), leader and line crossings with other lines and view outlines, GD&T frames and PMI (not planned). Stage H3: settle_inventory is a bounded strictly-improving pass over the placed linear labels (next lane, or one rung further), not a second placement engine."
  port_note: "Keep: post-assignment ink check inside the planner; unresolved overlap is a Plan problem (annotation_ink_overlap)."

- id: ADR2-11
  statement: "One view vocabulary; the authored view request and the resolved view plan are distinct immutable states."
