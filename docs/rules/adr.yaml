- id: ARCH0017-6
  statement: "Leader arrows target proved physical material (terminal, floor, side, the tangency on the owning face), never an open mouth, construction geometry or a raw page coordinate."
  class: drafting
  source:
    adr: "archive 0017 Amendments 8, 27"
    issues: []
    tests: []
  status: ported
  rust_test: "rendering::leader_rules::the_ports_own_callouts_touch_their_targets; rendering::leader_rules::flat_cut_bands_chamfers_and_fillets_lead_to_their_own_faces; rendering::leader_rules::flat_recess_and_slot_tips_lie_on_their_own_faces"
  rust_note: "Every callout leader is tipped at a site the Analysis proves (dims::leaders rim_tip on a feature's projected rim or a proven surface point; never a page coordinate), and lint verifies on the drawn sheet the hole (rim, double-D profile), blend and fillet (trimmed arc), turned-diameter (the band's own cylinder outline, trimmed by flats), chamfer (turned meridian about its coaxial band, prismatic section, oriented face), flat, recess and slot targets (src/lint/leaders.rs; tests/leader_rules.rs). A flat's face is the chord its plane leaves on each turned band it cuts, over the span it cuts (crate::lint::turned::flat_cuts), or on stock no band records its plane within the part's box over its stock span (flat_leader_target_*). A section recess's faces are its published section swept along its run (crate::lint::section_recesses::swept): its walls, its floor and capped ends, never its opening or an open end, so a tip in a through pocket's mouth or across a seat's chord is a mismatch; an open chain of square supports (an edge-open pocket) floors the rectangle of its extents (recess_leader_target_*). A through slot's faces are its outline (semicircular ends when its end radius is half its width) swept through it, a slot pattern's its member slots', an oriented slot's its passage section along its run (slot_leader_target_*; an end radius stays judged against its arcs). The planner's obround-pocket wall sites were moved off the box corners past the end arcs onto the straight walls (src/dims/recesses.rs), moving 20 MFCAD pocket leaders; no corpus drawing has a flat, recess or slot leader finding."
  port_note: "triage 2026-10-16: PORT, value medium, size M, stream leaders-and-tips"

- id: ARCH0018-1
  statement: "Projection convention (first or third angle) is a hard planning input: principal views keep their conventional side and alignment relationships, and a relational constraint that contradicts them is infeasible rather than silently repacked."
  detail: "Sections, details and NTS orientation views have the freedom drafting convention allows; an unconventional principal arrangement needs an explicit opt-out and the labelling to stay unambiguous. Listed as an Open delivery-gate item in ADR 2."
  class: drafting
  source:
    adr: "archive 0018 §4; ADR 2 Open"
    issues: []
    tests: []
  status: ported
  rust_test: "rendering::views_layout_rules::principal_relations_cannot_contradict_the_projection; rendering::views_layout_rules::indirect_principal_relations_report_projection_infeasibility; rendering::views_layout_rules::contradictory_principal_pins_stay_fixed_and_report_infeasibility; rendering::sheet_projection::first_angle_swaps_the_views_and_the_symbol"
  rust_note: "First/third angle fixes principal side and projection-origin alignment. Contradictory front/plan or front/side relations, non-middle alignment, conflicting pins, and diagonal plan/side relations retain the authored intent and report projection_relation_infeasible as an error, preventing a falsely feasible drawing. Diagnostic plans remain inspectable in the editor. Moving front carries its free projection partners. Indirect constraints or pin obstacles that make the arrangement unconventional report projection_relation_infeasible as an error; the constraint is never silently relaxed. Sections and orientation views retain their freedom."
  port_note: "triage 2026-10-16: PORT, value medium, size S, stream views-and-layout"

