  rust_test: "rendering::sections::a_turned_part_leaves_out_the_view_that_repeats_its_profile"
  rust_note: "Rust never removes the isometric or a principal view for space: overflow moves the iso to sheet 2 under the agreed multi-sheet allocation (src/sheets.rs, overflow order iso first); the only automatic removal is the turned-part repeat, with its reason in the kept views' basis (src/demand.rs::turned_views; tests/sections.rs::a_turned_part_leaves_out_the_view_that_repeats_its_profile). Python's completeness-driven iso yield is superseded by the multi-sheet allocation."
  port_note: "Keep: planner rule; any view removal records the triggering requirement in the Plan basis."

- id: ADR2-14
  statement: "Detail and isometric view scale factors are exact, and unequal principal-view scales are refused."
  detail: "Independently enlarged detail views carry their scale; an independently resized orientation/isometric view is labelled NTS (archive 0018 §7)."
