  rust_rule: "An explicit scale is kept as asked (maintainer: explicit choices override) and a misfit is reported with the nearest fitting pair as its fix (model::recover pinned branch, page_fit_uncertain; tests/issue_drafting.rs::a_scale_that_does_not_fit_is_reported); every unplaced item is reported (Policy B)."
  port_note: "Keep: Spec scale policy {default, strict, permissive}; the Plan records requested/effective scale, attempts and blocker ids."

- id: ADR2-3
  statement: "Scale before sheet: a bounded larger-scale trial on the selected page runs before the optional isometric is removed and before a larger sheet is tried."
  detail: "Every attempt is recorded; hard two-candidate work budget; an explicitly requested page pins the sheet, not the scale (archive 0004 amendments #1155, #1338)."
