  status: ported
  rust_test: dimensions::dimension_rules::renderers_draw_only_from_the_plan
  rust_note: "Ported for dimensions and callouts (src/dims/mod.rs: render draws each item's planned terms and ink). No PMI text exists yet. Closed by the rules assessment of 2026-10-11: renderers draw dimensions, callouts and source-authored PMI only from plan items; nothing further is worth porting."
  port_note: "Keep: renderers read only Plan entries' text; author-supplied PMI/GD&T text is carried verbatim in the Plan with a 'source-authored' basis."

- id: ADR4-5
  statement: "Dimension intent has exactly two explicit sources: automatic or a complete authored set; mixing them raises, requesting neither raises, and augmenting requires the automatic source."
  detail: "Omission means suppression only inside a set declared complete. 'Implicit-by-usage' (any declared dimension turns automatic off) was rejected as action at a distance (archive 0016)."
  class: spec
  source:
    adr: "ADR 4 invariant 5; archive 0016 'Two explicit sources of dimension intent'"
    issues: [933]
    tests: ["test_add_dimension.py", "test_sheet_identity_invariant.py (test_dimension_intent_verb_roster_is_closed)"]
  status: translated
  rust_rule: "R4 (accepted 2026-10-07): A Spec dimension_source (auto, authored); an authored set is complete; invalid combinations are validation errors. Decided 2026-10-07: keep both modes, defaults by default and an opt-in complete set. In the Spec schema as dimension_source (auto | authored) with dimensions keyed by ID; omissions inside an authored set are honoured, stale IDs warn without applying the edit, and an unknown source remains refused (#308)."
  rust_test: dimensions::dimension_rules::both_dimension_sources_and_their_validation
  port_note: "Translate: Spec has an explicit dimension_source {auto, authored}; authored lists are complete; auto may carry additions; invalid combinations are Spec validation errors."

- id: ADR4-6
  statement: "Dimension identity is the parameter id, derived and never positional; a bare role naming more than one measurement is refused, and an ambiguous selector raises rather than guessing."
  detail: "role.kind[.discriminator] uniformly (bore.diameter, grid_pitch.length.row); kind always included so an id never depends on sibling parameters; discriminator is row/col not x/y because a grid may be rotated; list position and UUIDs rejected; ids readable and stable across re-detection (archive 0016 Dimension identity, Amendment 3)."
  class: trust
  source:
    adr: "ADR 4 invariant 6; archive 0016 Amendment 3"
    issues: [869, 870, 871]
    tests: ["test_parameter_id.py", "test_dimension_role_vocabulary.py", "test_add_dimension.py (test_an_ambiguous_role_raises_rather_than_guessing)"]
  status: ported
  port_note: "Keep: stable Spec/Plan ids use the same derived scheme so Python-era ids map one-to-one."
  rust_test: audits::trust_rules::dimension_ids_are_derived_and_a_bare_role_warns_without_applying
  rust_note: "Over the fixture parts and the sampled corpus parts, every ID is d:<feature>/<role.kind[.discriminator]>@<view>, unique, naming a recognised feature, pattern, the envelope or the height ladder (step_level, draftwright's StepLevelFeature, whose rungs and shoulders are discriminated by their own value to the thousandth, step_height.length.h16, step_position.length.x136_525, never by rank, so losing a level renames no other rung and its old ID warns as an unapplied edit: tests/dims_steps.rs::a_rungs_id_names_its_height_not_its_rank; see ARCH0015-2), and unchanged when recognition reports its features in reverse order (feature IDs: tests/bridge.rs::ids_are_unique_stable_and_independent_of_discovery_order). The spec addresses a dimension only by its whole ID, so no selector can be ambiguous: a bare role or an unknown saved ID is retained with an unapplied-edit warning; no measured item is guessed or omitted. The parameter names are draftwright's, compared fact by fact in tests/dimensions.rs."

- id: ADR4-7
  statement: "Suppression changes what is shown, never what the drawing asserts: no renderer derives an engineering fact from a parameter's absence."
  detail: "A blind hole never reads THRU because its depth was omitted; facts live on the feature, parameters carry values for display; a compound callout's head cannot be suppressed while its dependents remain (raises)."
  class: drafting
  source:
    adr: "ADR 4 invariant 7; archive 0016 'Suppression changes what is shown'"
    issues: []
    tests: ["test_suppression_marks.py"]
  status: ported
  rust_test: dimensions::dimension_rules::blind_and_through_holes_are_separate_requirements
  rust_note: "THRU is read from the feature's bottom, never from a missing depth. A callout is one plan item, so no term of it can be suppressed alone yet; the head-without-dependents validation arrives with per-term overrides. Closed by the rules assessment of 2026-10-11: there are no per-term overrides, so no head can be suppressed apart from its dependents."
  port_note: "Keep: feature facts (through, thread) live on the feature in Analysis/Spec; Plan omission of a parameter never changes them; head-without-dependents is a Spec validation error."

- id: ADR4-8
  statement: "Authored omission and planner suppression are distinct ledger rows."
  class: trust
  source:
    adr: "ADR 4 invariant 8 (= ADR 5 invariant 8)"
    issues: []
    tests: ["test_suppression_ledger.py (test_an_authored_omission_is_distinguished_from_a_rule_suppression)"]
  status: ported
  port_note: "Keep: Plan omissions carry basis 'authored' vs 'rule:<name>'."
  rust_test: dimensions::dimension_rules::both_dimension_sources_and_their_validation
  rust_note: "In part: every authored omission is a row in the plan's omitted, with basis 'authored: …' (and 'inactive: …' across a revision). The planner suppresses nothing by rule yet (ADR1-8's conveyed_by is not ported), so there is no rule row to tell apart; when one is, it must be an omitted row with basis 'rule:<name>'. Closed by the rules assessment of 2026-10-11: the plan's omitted rows say whether the author left an item out or another item conveys it (State::Covered), so the two are never confused."

- id: ADR4-9
  statement: "Nothing the plan approves may vanish silently: a tolerance reaches the ink through the label, and an undrawable approved mark is reported against its measurement."
  class: trust
  source:
    adr: "ADR 4 invariant 9; archive 0016 Amendment 6"
    issues: [1215, 1234, 1216]
