  port_note: "Retire: Rust visibility rules make this a compile-time property."

# ---------------------------------------------------------------------------
# ADR 2 - Sheet layout and view planning
# ---------------------------------------------------------------------------

- id: ADR2-D1
  statement: "Which views exist is the engine's decision, driven by requirements: a view earns its place by carrying measurements no other selected view can."
  class: drafting
  source:
    adr: "ADR 2 Decision"
    issues: []
    tests: []
  status: translated
  rust_test: "tests/views.rs"
  rust_note: "View set is ported from draftwright's decisions and pinned fact by fact: tests/views.rs against known_views.json (only differences: hanger's detail view, string_post's section); the turned-part reduction (demand::turned_views, src/model.rs) drops a view that carries nothing new and states why in PlannedView.basis."
  rust_rule: "View set is ported from draftwright's decisions and pinned fact by fact: tests/views.rs against known_views.json (only differences: hanger's detail view, string_post's section); the turned-part reduction (demand::turned_views, src/model.rs) drops a view that carries nothing new and states why in PlannedView.basis."
  port_note: "Keep: every Plan view carries the requirement ids that justify it as its basis."

- id: ADR2-D2
  statement: "Page, preferred standard scale, view set and arrangement are one constrained choice; a candidate is feasible only if the real placement solve preserves every supported requirement with every block in bounds."
  detail: "Evaluated against complete view blocks measured with fixed paper-space typography; paper economy never outranks requirement survival, legibility or projection convention."
  class: drafting
  source:
    adr: "ADR 2 Decision"
    issues: []
    tests: []
  status: ported
  rust_test: issue_drafting::sheet_selection_is_bounded_and_keeps_every_outcome
  rust_note: "Stage H6: each sheet/scale candidate is a complete finished plan; only valid, complete candidates (no hard finding, nothing dropped, every item in bounds) compete."
  port_note: "Keep: page/scale/view selection in the planner is judged on the finished placement, not geometry bounds."

- id: ADR2-D3
  statement: "Infeasibility is a first-class result, never a silent relaxation of an authored constraint."
  class: trust
  source:
    adr: "ADR 2 Decision"
    issues: []
    tests: []
  status: ported
  port_note: "Keep: an infeasible Spec constraint yields a structured Plan problem naming the constraint, never a quietly altered plan."
  rust_test: audits::trust_rules::an_authored_constraint_is_kept_and_its_infeasibility_reported
  rust_note: "The spec's constraints are its sheet size and scale, its view omissions and its dimension source and omissions. A sheet and scale that cannot hold the views are kept, with page_fit_uncertain; a scale no sheet holds is kept on A0, with views_do_not_fit; an omitted view stays omitted and what only it could carry is reported (view_plan_incomplete; also tests/dimension_rules.rs::nothing_approved_vanishes_when_its_view_is_omitted); a value outside the vocabulary is refused with the choices (tests/model.rs::invalid_requests_say_what_would_do)."

- id: ADR2-D4
  statement: "Compose-then-pack: each selected view is composed with its annotation footprint before the page is packed."
  detail: "Footprints are page-mm boxes so the scale/page search is rectangle arithmetic; OCC geometry is built once at the resolved position; a bounded measured repack corrects the seed estimate. The block footprint includes dimensions, callouts, balloons and furniture such as the hole table (archive 0004)."
  class: drafting
  source:
    adr: "ADR 2 Decision; archive 0004"
    issues: [121]
    tests: []
  status: translated
  rust_rule: "src/demand.rs reserves feature bands before the page/scale search (bands_match_draftwright_or_are_known; tests/views.rs::corpus_views_and_their_bands_keep_apart_and_off_the_title_block); instead of Python's measured repack, sheet_fit::correct_estimate and model::recover's drawn_items_fit judge the finished drawing."
  rust_note: "src/demand.rs reserves feature bands before the page/scale search (bands_match_draftwright_or_are_known; tests/views.rs::corpus_views_and_their_bands_keep_apart_and_off_the_title_block); instead of Python's measured repack, sheet_fit::correct_estimate and model::recover's drawn_items_fit judge the finished drawing. Missing hole-callout/angular bands are listed in tests/fixtures/known_bands.json."
  rust_test: "rendering::bands::bands_match_draftwright_or_are_known; rendering::views::corpus_views_and_their_bands_keep_apart_and_off_the_title_block"
  port_note: "Keep: the planner sizes each view block including its annotations before choosing page/scale."

- id: ADR2-D5
  statement: "Within a view, annotations are never placed as they are rendered: every pass collects candidates, one deterministic solve per strip selects, orders and spaces them, then they are emitted."
  detail: "Over capacity is a ranked selection, not an arrival-order drop."
  class: drafting
  source:
    adr: "ADR 2 Decision; archive 0009, 0014"
    issues: []
    tests: []
  status: translated
  rust_note: "Placement is a plan-stage solve over all of a view's items (src/dims/placement.rs settle, src/dims/label_lanes.rs), never at render; the ranked over-capacity drop is superseded by Policy B (keep and report, never silently drop)."
  rust_rule: "Placement is a plan-stage solve over all of a view's items (src/dims/placement.rs settle, src/dims/label_lanes.rs), never at render; the ranked over-capacity drop is superseded by Policy B (keep and report, never silently drop)."
  port_note: "Keep: plan-stage placement collects all strip occupants then solves; drop order is by priority/key, recorded per entry."

- id: ADR2-D6
  statement: "Policy B: when avoiding an occupant would cost more than a bounded relocation, the annotation stays and the crossing is logged; never an unbounded search, never a real annotation dropped for tidiness."
  detail: "Archive 0009 Amendment 2 bound: relocate only when it costs no more than one min_gap of extra displacement from the natural position. Ratified 2026-07-02: 'I would rather have a crossing leader line than drop the callout'."
  class: drafting
  source:
    adr: "ADR 2 Decision; archive 0009 Amendment 2, 0014"
    issues: [368]
    tests: ["test_layout_cleanliness.py"]
  status: retired
  rust_test: "rendering::leaders::callout_leaders_cross_nothing_unlisted"
  why: "Rules assessment 2026-10-11: the relocation bound is Python tuning; the port's bounded search and logged crossings already hold the policy."
  rust_note: "Partial: a callout is never dropped and its search is bounded (src/dims/leaders.rs); a crossing it keeps is logged (annotation_leader_crossing for a line, annotation_ink_overlap and annotation_overlap for a label) and listed with a verdict in tests/fixtures/known_leaders.json. A linear dimension's label slides a bounded distance and otherwise stays and is reported (dims::placement::settle). On ctc04 no kept crossing has a clear route of the clear-route sweep (ISSUE-1187-a, tests/issue_regressions.rs::issue_1187_a_retained_leader_crossings_have_no_clear_route). Between as many crossings the leader takes a line crossed by its shaft over its text on a line, as draftwright protects text both ways (annotation_text_ink_clear). Not ported: draftwright's relocation bound (one min_gap from the natural row); the port takes any clear candidate, shortest first. The problems are warnings, not info."
  port_note: "Keep: placement rule; a retained crossing is a Plan problem (info) attached to the annotation id."

- id: ADR2-D7
  statement: "Users edit whole view blocks (presence, relations, a pin on a projection origin), never feature-annotation coordinates."
  class: spec
  source:
    adr: "ADR 2 Decision"
    issues: []
    tests: []
  status: translated
  rust_rule: "R4 (accepted 2026-10-07): R1 invariant 1: Spec views carry presence, relations and an optional origin pin; the Spec has no coordinates."
  port_note: "Translate: Spec view entries carry presence, relational constraints and an optional origin pin; Spec has no annotation coordinates."

- id: ADR2-1
  statement: "Footprints are boxes, the scale/page search is box math, and the corrective repack is bounded."
  detail: "No OCC bbox is measured inside the (scale, page) search; _REPACK_MAX_ITER bounds the corrective loop. The rule constrains the fitness search, not post-build verification (archive 0004 amendment 2026-07-18)."
  class: machinery
  source:
    adr: "ADR 2 invariant 1"
    issues: []
    tests: ["test_layout.py", "test_repack_geometry_seam.py", "test_issue_1216_callout_reservation_measures_ink.py"]
  status: translated
  rust_rule: "R4 (accepted 2026-10-07): The estimate-then-verify structure and its iteration bound stay, for termination and determinism; the OpenCascade cost that motivated it is gone (R2)."
  port_note: "Translate: keep the estimate-then-bounded-verify structure in the Rust planner; the OCC-cost motivation largely disappears but the bound on iterations stays."

- id: ADR2-2
  statement: "An explicit scale may cramp geometry but never silently lose a requirement."
  detail: "Default policy retries smaller preferred ISO 5455 scales and selects the largest complete candidate at or below the request; strict refuses; permissive warns; the decision is recorded with stable blocker identities (archive 0004 amendment #1146)."
  class: drafting
  source:
    adr: "ADR 2 invariant 2; archive 0004 amendment 2026-08-14"
    issues: [1146]
    tests: ["test_issue_1146_scale_completeness.py"]
  status: translated
  rust_test: "issue_drafting::a_scale_that_does_not_fit_is_reported"
