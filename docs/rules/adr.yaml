    issues: [955]
    tests: ["test_issue_955_height_contingency.py"]
  status: retired
  why: "Rules assessment 2026-10-11: there are no contingencies: placement never drops a chain, so nothing is held inactive for release."
  port_note: "Keep: Plan carries contingent entries with a 'contingent_on <id>' basis; activation is a planner decision recorded in the Plan."
  rust_note: "There are no contingent plan items. A whole connected multi-step profile now uses an inspection baseline whose final rung is the overall length (src/dims/turned.rs; tests/dims_turned.rs::the_overall_finishes_the_default_baseline_and_a_partial_profile_keeps_its_length). Independent profiles retain supported chains. Placement keeps every required item placed or reported, so Python's contingency triggered by dropping the entire chain does not arise."

- id: ADR4-11
  statement: "Edits are scale-independent intents in the shared solve: pin and priority, never raw coordinates; the raw single-slot placement verb survives only as a deprecated escape hatch."
  detail: "dimension(..., pin=, priority=) drained by finalize() through _PASS_SEQUENCE; place_dim is the deprecated raw fallback."
