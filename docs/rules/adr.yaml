- id: ARCH0019-3
  statement: "A collapsed n× mark states a tolerance band only when every member states the same band at the drawn precision; otherwise the band is withheld with a diagnostic."
  detail: "Proposed; replaces three divergent implementations (pitch over jittered gaps, fillet first-authored-wins, ladder representative)."
  class: drafting
  source:
    adr: "archive 0019 §1 (Proposed)"
    issues: []
    tests: []
  status: ported
  rust_test: dimensions::tolerances::ftc06_prints_the_authored_bands_as_draftwright_does
  rust_note: "src/dims/tolerance.rs: an n× callout states a fit only when every member it counts has the same one; otherwise it prints none and a tolerance_withheld warning names each member's fit (ctc01's hole pair, ftc06's bosses). A tolerance is keyed by the collapsed mark's own ID, so it is one band for the mark; a pattern's n× pitch is collapsed only from gaps equal within 1e-4 mm (src/dims/holes.rs), so its band holds of every gap. draftwright splits a group of bosses with different fits into separate callouts instead (ftc06: 3× ø44.5 and ø44.5 h6), listed rust-wrong in the test: splitting needs the boss and hole planners to group by fit."
