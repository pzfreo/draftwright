- id: ARCH0015-2
  statement: "A correlated set (a step-height ladder, a shoulder chain) is approved or omitted whole and never flattened into independent dimensions: never half a staircase."
  detail: "A datum-coincident shoulder measures no distance, is removed before the set forms, and is reported as step_position_coincident_with_datum (archive 0016 Amendment 1). One addressable id with N members; members not separately addressable."
  class: drafting
  source:
    adr: "archive 0015 'Model-routed today'; 0016 Amendment 1 and 'Dimension identity' tier 3"
    issues: []
    tests: []
  status: ported
  port_note: "triage 2026-10-16: PORT, value high, size M, stream one-owner"
  rust_test: audits::ownership_rules::a_height_ladder_is_omitted_or_approved_whole
  rust_note: "Stream K6 (src/dims/mod.rs::correlated_sets): each rung and shoulder keeps its own ID (step_height.length.h<height>, step_position.length.<axis><position>, named by value, never rank: ADR4-6), so the spec's decision on any member is its set's: with the automatic source, omitting one rung omits the whole height ladder (and one shoulder all the shoulders along its axis), each other member omitted with a basis naming the set; with an authored set, listing one member approves the set. An info problem correlated_set_whole names the members the decision spread to, its fix removing the omission. An omission never overrides a member the spec decides itself (a tolerance, view, place or omit: false): that set is drawn as stated with a correlated_set_conflict warning, its fix removing the omission (tests/ownership_rules.rs::a_ladder_omission_never_overrides_a_rung_the_spec_decides). A turned profile's chain is not such a set: omitting one link of a chain is ordinary drafting, and its baseline already restores a band's length when a rung is omitted (#33). A shoulder standing on the box is reported (step_position_coincident_with_datum), not drawn. A uniform staircase is one counted rise (n× rise), as draftwright's _step_repeat makes it (tests/dims_steps.rs::a_uniform_staircase_is_one_counted_rise)."

