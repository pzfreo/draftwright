- id: ARCH0014-5
  statement: "Balloons are assigned to bands by a maximum-cardinality, minimum-leader-length solve that preserves crossing-free member order; a remote band stays empty rather than creating a cross-part leader, and capacity loss is reported as balloon_dropped."
