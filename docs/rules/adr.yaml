- id: ADR4-U1
  statement: "Over-dimensioning that is neither identical nor coincident (for example a pattern's per-hole locations and its pitch) should be reported."
  detail: "Listed as Unguarded/Open in ADR 4 and ADR 5: the redundancy lint does not exist."
  class: drafting
  source:
    adr: "ADR 4 Unguarded; ADR 5 Open; archive 0016 'Preventing duplicate dimensions'"
    issues: []
    tests: []
  status: ported
  rust_test: "tests/h5_chains.rs::lint_detects_duplicate_claims_and_closed_turned_chains; tests/h5_chains.rs::slot_chain_keeps_overall_and_functional_length_without_closure; audits::ownership_rules::a_pattern_pitch_beside_every_members_location_is_reported; audits::ownership_rules::a_boss_height_on_a_stated_level_is_a_reference; tests/h5_chains.rs::ctc01_polygonal_boss_height_is_conveyed_by_its_level_and_the_overall; tests/h5_chains.rs::m10020_rungs_on_a_located_pockets_walls_yield_to_its_location_and_size"
  rust_note: "Ported (2026-10-23), with its unimplemented clauses retired: independent drawing lint reports repeated measurement claims and closed supported linear chains; the planner keeps an overall and one reference member. Stream K6 adds the pattern case (src/lint/hole_patterns.rs, over_dimensioned_pattern): a linear or grid pattern's pitch printed beside every member's own location along that axis; the planner locates a pattern by its centre (or first member) with its pitches, so it draws none (tests/ownership_rules.rs::no_measurement_is_drawn_twice_on_the_test_parts). The planner also resolves a boss height closed by a stated ladder rung and the overall height (src/dims/redundancy.rs: the boss height becomes reference, tests/ownership_rules.rs::a_boss_height_on_a_stated_level_is_a_reference). At K6, lint reported editor_pmi's grid pitch beside its hole schedule's member coordinates (a hole-table decision; see stream one-owner (2) below). Stream one-owner: a polygonal boss's height has its support planes too (src/lint/redundancy.rs::span), so ctc01's 50 on the 100 rung under the 150 overall is a reference, and lint accepts a boss height the stated chain determines (src/lint/redundancy.rs::determined). Whole connected turned profiles use the inspection baseline (tests/detail_views.rs::string_post_heights_share_one_origin_and_extension_lines_clear_text). Stream one-owner (2): compound counts are ported. Lint reads a counted label (`2× 2`) as stating each member's interval and a compound callout each claim's, so a rung drawn beside a pocket's location and its counted width is a closed chain (src/lint/redundancy.rs::stated); the planner reads its own labels the same way (ADR1-8). The editor_pmi grid-pitch report no longer reproduces on main, by default or with hole_table always (checked 2026-10-23). Retired (maintainer approval 2026-10-23): angular sets, since the planner draws no angular member locations or angular pitches (a bolt circle is located by its centre and pitch circle with equal spacing implied), so no automatic angles share a vertex; each angle it draws belongs to one feature (notch, chamfer, ramp, profile corner) or one PMI record, which is controlling by PMI precedence and never reference (#33); and lint's marks carry no angular geometry to walk. No corpus drawing has two angles on one vertex."
  port_note: "triage 2026-10-16: PORT, value low, size M, stream one-owner"

