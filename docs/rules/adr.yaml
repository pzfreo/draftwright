- id: ARCH0015-4
  statement: "Whole-part regular hexagonal stock is dimensioned by across-flats and axial length, replacing the orientation-dependent envelope dimensions."
  class: drafting
  source:
    adr: "archive 0015 Consequences"
    issues: []
    tests: []
  status: ported
  port_note: "Keep: planner rule for polygonal stock."
  rust_test: dimensions::dims_stock::hexagonal_stock_states_its_size_across_flats_and_length_as_draftwright_does
  rust_note: "src/dims/stock.rs: a polygonal_stock feature that keeps quiddity's PolygonalStock contract (lint's stock_wanted: six sides, one regular ring, one stock) is read as a polygonal boss is (bosses::read_polygon) and gets `HEX <A/F> A/F` (or `N-SIDED`), a callout with a leader to a flat in the view down its axis (x side, y front, z plan), and its length (top - base) as a linear dimension in the profile view (x front, y side, z front), both labelled with fmt; src/dims/envelope.rs then states no overall extent. On five fixture bars (tests/fixtures/recognition/polygonal_stock: along z, x and y, turned 17 degrees about its axis, and moved off the origin) parameters, views, labels and values match draftwright's sheets, and lint finds both requirements stated (tests/dims_stock.rs). Verdicts: (1) no overall extent: equivalent (draftwright emits no envelope feature for a part with stock, envelope_is_emittable in recognition_ownership.py, so it has no extent to address or omit either; the port leaves no omitted row or lane for one, as for a part turned whole, and the stock dimensions' bases name the extents they replace). (2) draftwright's #1560 safeguard (compiled.py, overall_dim_withheld) records the x and y extents as withheld, an error in its lint, unless a spanned measurement covers them: on the plain bar it flags the depth that the A/F states (rust-correct: the A/F is that span), and the across-corners or turned extents (undetermined: ADR 0015 says they are replaced, #1560 says unstated; a question in docs/next-session.md); the port records nothing for them, and its envelope lint (src/lint/envelope.rs) credits the length with the extent along the bar and the A/F with each extent across it that the regular section's corners reach, whatever its roll, so no missing_principal_dimension is reported (tests/dims_stock.rs::the_stocks_statements_state_its_overall_extents). (3) the length is placed outermost from the outline (order 2, as the extent it replaces), draftwright's in the size sub-chain from the axis line: equivalent on the fixtures, where it is the only dimension on its side. (4) with its profile view omitted the length moves to the other profile view, as a boss height does, and the basis says so; draftwright reads it only in its edge-on view (rust-correct: the same span shows there). (5) a record that breaks the contract, or a second stock, is reported feature_not_dimensioned and the extents are kept (not-applicable: quiddity's recogniser emits at most one, and only within its contract; tests/dims_stock.rs covers both)."

