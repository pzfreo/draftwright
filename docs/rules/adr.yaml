- id: ARCH0003-2
  statement: "Edit locality: adding or nudging one annotation must not silently shift unrelated ones; an edit's blast radius is part of the editability contract."
  class: trust
  source:
    adr: "archive 0003 'Edit locality'"
    issues: []
    tests: []
  status: translated
  rust_rule: "R4 (accepted 2026-10-07): a small spec edit changes only the affected plan items. Every item the part would have is placed (its lane, and where its label settles) before the spec chooses what is drawn, so omitting a dimension, restoring it, or adding or removing one in an authored set moves no other item, view or the sheet."
  rust_test: omitting_one_dimension_moves_no_other
  port_note: "Translate: re-planning after a small Spec edit should change only affected Plan entries; add a stability test (Plan diff size) since Python never guarded it."
  rust_note: "Checked on the fixture parts and on m10127, hanger and ftc06 (tests/placement.rs): omitting any one default dimension in auto, or leaving it out of an authored set, leaves every other item's ink, the views and the sheet unchanged; only the collision problems naming that item change. An item the defaults merge away (one span, one dimension, ARCH0009-6: a coincident location, a shared size, a boss height the overall extent conveys) takes its survivor's lane, decided among every item the part would have under the defaults' labels (dims::placement::owners), so it leaves no gap, and omitting the survivor draws it in that same lane, moving nothing else (checked by the same test). One the spec's labels un-merge (a tolerance on its survivor) is drawn in its strip's next free lane, outside every lane held, so nothing else moves either (dims::placement::separate; tests/placement.rs::a_merge_the_spec_breaks_draws_both_in_their_own_lanes). The cost: a label may keep clear of a line the spec omits. Not covered, as the spec cannot express them yet: nudges (placement offsets). Edits to the sheet (size, scale) or the view set (omitting a view re-routes its items and re-packs the layout) move other items by design."

