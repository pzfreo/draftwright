  rust_note: "Band assignment now uses residual min-cost max-flow: maximum cardinality first, certifying row keys before optional markers, then actual leader distance to the bands, with deterministic ties. Members keep their geometric order and are spread within free-stretch capacity. Perimeter spreading has Python's bounded halo credit, so a remote band cannot win merely to occupy it. Final candidates reject crossings of dimension and extension lines as well as labels, furniture and other balloons. Capacity or routing loss is still balloon_dropped and the table transaction rolls back whole."

