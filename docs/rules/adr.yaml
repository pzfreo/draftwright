- id: ARCH0009-6
  statement: "Two features measuring the same span on one axis produce one dimension: the higher-precedence measurement survives (a hole location outranks a coincident slot position) and the displaced duplicate is not reported as a drop."
  detail: "Coincidence key (view, measured origin, measured endpoint) built from raw, pre-snap endpoints; a dropped winner promotes its top loser (archive 0014)."
  class: drafting
  source:
    adr: "archive 0009 Amendment 6; 0014 Decision"
    issues: [345]
    tests: []
  status: ported
  port_note: "Keep: dedup rule in the planner; the losing entry appears in the Plan as omitted with basis 'conveyed_by <id>'."
  rust_test: dimensions::dims_slots::ctc01_hex_boss_location_is_conveyed_by_its_hole_grid
  rust_note: "src/dims/holes.rs::consolidate, one pass over every kept location from the part's box (holes, hole and slot patterns, bosses, slots along and across, blind slots), after the spec's tolerances: those in one view on one axis whose raw origin and endpoint agree within 1e-6 mm and whose labels (tolerance included) are equal are drawn once. The survivor is the highest rank (hole, hole-pattern and slot-pattern locations, as draftwright's _location_candidate precedence=2 carries all three; then the port's boss location, which draftwright does not draw; then slot positions, _slots.py precedence=1), then one the spec lists (draftwright's pinned precedence=3), then the smaller ID (draftwright breaks ties on name); each loser moves to omitted, 'conveyed by <id>: ...', and is no problem. Coincidence is decided among the kept items, so omitting the survivor promotes the top loser (draftwright promotes on a failed placement; the port never drops for room, so its only drop is the spec's: not-applicable). Differences: draftwright keys on page ends rounded to 0.1 mm, so at 1:1 a 40.00 and a 40.02 span that both print 40 merge there and stay two here (undetermined: geometric identity against a scale-dependent bin that its own comment says can split coincident spans); draftwright's survivor also claims the losers' measurements (_group_measurements), the port's keeps its own (one feature's axis per location, ISSUE-883-a) and the omitted entry records what it conveys (undetermined: no lint check reads a boss's location claim yet; src/lint/slots.rs::shared_locations credits a slot position line to every lone slot on its span, seen through the same axis, #228). A new planner's locations from the box take part once holes.rs::rank names their parameter (on this branch every planner's do). Sizes too (src/dims/mod.rs::share, tests/repeated_dimensions.rs): kept items stating the same linear pattern pitch, slot width, slot length or boss height of different features across the same span (view, axis, raw ends within 1e-6 mm, label with its tolerance) are drawn once; the survivor (spec-listed, then smaller ID) claims every member's measurement and, except for a pitch, prints their count (`2× 6`, `4× 38.1`); the others move to omitted, conveyed by it. The pitch is draftwright's _coalesce_aligned_linear_pitch_dims (parallel rows on the same stations, label unchanged, both measurements kept: ctc02's sheet), the slot width its shared width (_slot_shared_width_key; `2× 15.2` on ftc08's sheet), applied in every view, where draftwright applies it only where both dimensions enter one corridor solve (cgb245's two 6 widths along y: rust-correct, that condition is a placement mechanism, not a drafting rule). Slot lengths and boss heights are beyond draftwright, whose sheets repeat them on one span (ftc06's four 38.1, ftc07's four 2.5): rust-correct by this rule's statement and the maintainer's directive of 2026-10-09 (state each quantity once). Not merged: equal sizes on different spans (each feature keeps its own), and coincident spans of different parameters (a step-height rung on the same span as a boss height or a hole location, ftc06 and ftc10: draftwright's ladder has no coincidence key and its planner names no principled owner between peers; a maintainer question). A displaced item takes no lane of its own (dims::placement::owners: it shares its survivor's, as draftwright's corridor dedup places no displaced duplicate while its winner is drawn; draftwright's pitch coalescing runs after placement, so its removed pitch leaves its lane empty, where the port's does not: rust-correct, the gap is ink-free space that pushes the outer lanes out). Also checked by src/dims/holes.rs's unit tests (precedence, raw ends and label, spec and ID tie-breaks), tests/dims_slots.rs::cgb245_slots_state_width_length_end_radius_and_location (a hole location conveys a slot's), and the promotion by tests/trust_rules.rs::every_planned_dimension_can_be_addressed and tests/placement.rs::omitting_one_dimension_moves_no_other."

