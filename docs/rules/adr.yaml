  port_note: "triage 2026-10-16: PORT, value low, size S, stream regression-pins"

# ---------------------------------------------------------------------------
# ADR 3 - The recognition boundary
# ---------------------------------------------------------------------------

- id: ADR3-D1
  statement: "Recognition reasons about geometry, drafting reasons about drafting: the provider ships no drafting policy and Draftwright never rescans topology to second-guess a record."
  detail: "Consumers take one of three paths: main-part analysis uses the build's cached aggregate; a standalone API or a separate shape may use a standalone recogniser; a bounded face question uses quiddity.inspection."
  class: machinery
  source:
    adr: "ADR 3 Decision"
    issues: []
    tests: []
  status: translated
  rust_rule: "R4 (accepted 2026-10-07): R2 and quiddity-rust: quiddity owns recognition, analyse consumes its records, and plan never scans the B-rep for features."
  port_note: "Translate: quiddity-rust owns recognition; draftwright-rust's analyse step consumes its records and never re-scans B-rep for features."

- id: ADR3-1
  statement: "Recognition executes in the provider, never in Draftwright."
  detail: "Main-part consumers use the aggregate; standalone call sites are an exact roster with one reviewed reason each; src/draftwright/recognition/ is a re-export facade."
  class: machinery
  source:
    adr: "ADR 3 invariant 1"
    issues: []
    tests: ["test_external_recognition_boundary.py", "test_quiddity_lifecycle_boundary.py", "test_counting_calls.py"]
  status: translated
  rust_rule: "R4 (accepted 2026-10-07): The crate boundary: no recognition code in draftwright-rust."
  port_note: "Translate: crate boundary quiddity (recognition) vs draftwright (drafting); no recognition code in the drafting crate."

- id: ADR3-2
  statement: "One recognition aggregate per build; zero for a declared render."
  detail: "An automatic build calls build_recognition_evidence exactly once; a declared build/render calls nothing; first physical critique/export obtains at most one cached aggregate; repeated lint adds no call."
  class: machinery
  source:
    adr: "ADR 3 invariant 2; archive 0017 Accepted Contract §6"
    issues: []
    tests: ["test_detect_once.py", "test_declared_recognition_gate.py", "test_recognition_result.py"]
  status: translated
  rust_rule: "R4 (accepted 2026-10-07): analyse runs recognition once; plan and render never do. The \"none for a declared render\" half is retired with ADR4-3."
  port_note: "Translate: analyse() runs recognition once and its Analysis document is reused; planning a fully declared Spec needs no recognition, lint may request Analysis once."

- id: ADR3-3
  statement: "Consumers project the one recognition result; they do not rescan."
  detail: "Lint, model construction and reports read the cached result or a pure function of it; shared substrates (cylinder inventory, risers) are scanned once and reused."
  class: machinery
  source:
    adr: "ADR 3 invariant 3"
    issues: []
    tests: ["test_detect_once.py", "test_issue_958_cross_solid_recognition.py"]
  status: translated
  rust_rule: "R4 (accepted 2026-10-07): The Analysis is passed to plan and lint by reference."
  port_note: "Translate: Analysis is computed once and passed by reference to plan and lint."

- id: ADR3-4
  statement: "The provider join is fail-closed: every consumed family, record type and schema version is validated against the installed provider's manifest, and a mismatch fails the build."
  detail: "The exact provider version is pinned."
  class: trust
  source:
    adr: "ADR 3 invariant 4"
    issues: []
    tests: ["test_recogniser_capabilities.py", "test_inspection_contract.py"]
  status: ported
  port_note: "Keep: Analysis records the quiddity version/schema; draftwright refuses an Analysis with an unknown schema version."
  rust_test: core::bridge::a_document_the_bridge_does_not_know_is_refused
  rust_note: "In part. Both recognition paths are fail-closed, and plan refuses an Analysis or a Spec of a schema it does not read (tests/trust_rules.rs::a_document_of_an_unknown_version_is_refused; fixed here in src/model.rs: a spec of another version was read as spec/1 and rewritten as one); haecceity is pinned in Cargo.lock. The bridge (src/bridge.rs, Python quiddity's JSON, the live path) refuses a wrapper of another format, and in quiddity's document: a format other than quiddity-recognition version 3, a quiddity release other than 0.3.9 and 0.4.0.dev0 (QUIDDITY_VERSIONS) or other than the one the wrapper names (recorded as recognition.recogniser), coordinates other than local, a family or record type it does not know or a record type in a family it does not come in (RECORDS, the family/record-type pairs of quiddity 0.3.9's capability manifest), and a derived collection it does not know (tests/bridge.rs::a_document_the_bridge_does_not_know_is_refused, ::refusals_and_evidence_are_not_features). The native reader of Rust quiddity's recognition document (src/bridge/native.rs) refuses a schema version other than quiddity-rust/recognition/1, a family or record type that schema does not have, other than file coordinates, and a face count that is not the part's (tests/native.rs::the_reader_refuses_what_it_does_not_know), and a record of a family it reads that lacks a field draftwright reads of it, or has one of another shape, nested ones included, or whose faces are not strictly ascending (FIELDS; tests/native.rs::the_reader_refuses_a_record_without_what_draftwright_reads, ::the_reader_checks_each_familys_fields); its table must equal the provider's (tests/native.rs::the_reader_knows_the_providers_schema), and quiddity is pinned in Cargo.lock to haecceity's commit (tests/native.rs::quiddity_and_haecceity_are_pinned_together). Not yet: the native reader is tested but not live (analyse still takes every family from the bridge); the bridge's table is the 0.3.9 manifest written out by hand, not read from the installed provider's manifest as Python does (the bridge has no provider to ask; the JSON carries no manifest); and 0.4.0.dev0 is a development version string that names no exact quiddity commit, so on that release the provider is pinned only to its version string (a question for the maintainer in docs/next-session.md). Two derived collections the bridge knows are not read: oriented_slot_patterns and section_recess_patterns (their members are read one by one; draftwright gives oriented slot arrays no drafting grammar, #1430); hole_pairs and turned_profiles restate records it reads. Closed by the rules assessment of 2026-10-11: both readers fail closed and the native reader is live; the hand-written manifest table and the development-version pin are not worth more work."

- id: ADR3-5
  statement: "Every recognition record type has exactly one home: a typed adapter, an explicit consumer disposition, or a refusal."
