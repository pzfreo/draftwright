    corpus_parts: ["GRM-02"]
  status: ported
  rust_test: rendering::placement_intent::placement_vocabulary_is_validated_without_page_coordinates
  rust_note: "Ported: a dimension's place (view, side, lane, along, pinned) is semantic, a page coordinate is refused, and the request reaches the plan (from_spec names place) and the drawing."
