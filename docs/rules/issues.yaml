- id: ISSUE-563-a
  statement: "Authored dimension placement is expressed semantically (view, strip, side, corridor), never as page coordinates, and survives every stage to the rendered sheet."
  detail: "Referential intent places dimensions on opposite sides as asked; distinct per-dimension view overrides are honoured; an override vetoes an automatic view reduction."
  class: drafting
  source:
    issues: [563]
    tests:
      - "tests/test_issue_563_placement_intent.py::test_referential_intent_survives_ir_planner_compiler_and_places_opposite_sides"
      - "tests/test_issue_563_placement_intent.py::test_independent_envelope_dimensions_honour_distinct_view_overrides"
      - "tests/test_issue_563_placement_intent.py::test_referential_override_vetoes_an_automatic_view_reduction"
