- id: ISSUE-676-a
  statement: "A polygonal prism boss is recognised only from proven evidence: regular opposed parallel flat pairs of equal width, concurrent midplanes, attached to one solid; anything weaker is not inferred as a boss."
  detail: "Rejected: six-sided rings without opposed planes, sub-tolerance projections, blind polygonal recesses, standalone or detached prisms, unproved polygon classes."
  class: trust
  source:
    issues: [676]
    tests:
      - "tests/test_issue_676_polygonal_boss.py::test_a_six_sided_ring_without_regular_opposed_planes_is_rejected"
      - "tests/test_issue_676_polygonal_boss.py::test_opposed_pairs_with_different_widths_do_not_define_one_across_flats"
      - "tests/test_issue_676_polygonal_boss.py::test_a_blind_polygonal_recess_is_not_a_boss"
      - "tests/test_issue_676_polygonal_boss.py::test_a_detached_polygonal_component_is_not_a_boss_on_another_solid"
    corpus_parts: []
  status: retired
  why: "Recognition lesson, owner quiddity: quiddity-rust now has recognise_polygonal_bosses (its README table) and that is where the rejection cases belong. draftwright-rust only consumes PolygonalBoss records (src/dims/bosses.rs reads sides, across-flats and axis; never widens). Set owner: quiddity and move the test obligation to quiddity-rust."
  rust_note: "Recognition lesson, owner quiddity: quiddity-rust now has recognise_polygonal_bosses (its README table) and that is where the rejection cases belong. draftwright-rust only consumes PolygonalBoss records (src/dims/bosses.rs reads sides, across-flats and axis; never widens). Set owner: quiddity and move the test obligation to quiddity-rust. (retired, maintainer-approved 2026-10-16)"
  owner: "quiddity"
  port_note: "Keep: analysis-level tests on synthetic solids (recognition lives in quiddity/haecceity; consumer must not widen it)."

