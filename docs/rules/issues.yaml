  rust_test: "src/dims/leaders.rs::tests::the_assignment_matches_an_exhaustive_oracle"
  rust_note: "src/dims/leaders.rs::assign assigns every callout's leader jointly: fewest hard blockers, then fewest crossings (with the placed dimensions and between the chosen leaders), then least total length, checked against an exhaustive oracle and, as a scenario, on the captured parts and cgb245/ctc04 natively (tests/leaders.rs::callout_leaders_cross_nothing_unlisted). The port never drops a callout for want of a clear route (ISSUE-798-a), so 'maximise the number placed' is every callout, with crossings counted instead of conflicting leaders dropped; all callouts are required (the port has no optional leader jobs)."
  port_note: "Keep: unit test the leader assignment solver against an exhaustive oracle; scenario test for crossing-free result."

- id: ISSUE-740-b
  statement: "The leader assignment is work-bounded and deterministic: ties break on stable input order, sub-micron cost noise cannot reorder candidates, and budget exhaustion falls back to a greedy floor that keeps drop diagnostics."
  class: trust
  source:
    issues: [740]
    tests:
      - "tests/test_issue_740_leader_assignment.py::test_sub_micron_cost_noise_reaches_stable_candidate_order_tie_break"
      - "tests/test_issue_740_leader_assignment.py::test_state_budget_retains_the_legacy_greedy_incumbent"
      - "tests/test_issue_740_leader_assignment.py::test_bounded_legacy_fallback_preserves_drop_diagnostic"
      - "tests/test_issue_740_leader_assignment.py::test_pure_assignment_rejects_malformed_numeric_inputs"
    corpus_parts: []
  status: ported
  rust_test: "src/dims/leaders.rs::tests::a_large_group_is_bounded_and_deterministic"
  rust_note: "Costs are whole micrometres, so sub-micron noise cannot reorder candidates; ties keep generation and job order; each group of conflicting jobs is searched from its greedy assignment up to NODE_BUDGET nodes and keeps the best found, never worse than the greedy floor; every candidate search is bounded (MAX_STATIONS, DIRECTIONS, MAX_SITES, KEEP). Budget exhaustion drops nothing (every callout is placed), so there is no drop diagnostic to keep; a group whose search stopped at the budget is the structured plan problem annotation_leader_search_capped (info) naming its callouts (src/dims/leaders.rs::place; the test asserts the fired budget is returned)."
  port_note: "Keep: determinism + budget-fallback tests on the solver; budget exhaustion yields a structured problem, never a silent drop."

- id: ISSUE-740-c
  statement: "Joint leader assignment runs only after all feature leader jobs are collected; pre-drain stages keep immediate greedy semantics."
  class: machinery
  source:
    issues: [740]
    tests:
      - "tests/test_issue_740_leader_assignment.py::test_late_joint_assignment_stays_scoped_to_the_post_drain_adapters"
      - "tests/test_issue_740_leader_assignment.py::test_pre_drain_pattern_keeps_legacy_greedy_semantics"
    corpus_parts: []
  status: retired
  why: "R4 (accepted 2026-10-07): There is no drain: a Spec edit is re-planned whole by the one plan (as ADR2-6). Every callout's leader is placed in one stage, after the linear dimensions are settled, and assigned jointly (src/dims/leaders.rs::place, called once from dims::plan), so there is no pre-drain greedy stage to keep apart."
  port_note: "Retire: intent-drain staging; Rust plans all leaders in one solve."

- id: ISSUE-798-a
  statement: "A required callout is never lost for a routing reason: if no clear leader route exists the least-cutting acceptable candidate is placed; only a job with no acceptable candidate at all is dropped."
  detail: "Policy B: a required callout at a logged cost beats a missing dimension. Lookahead for a clear route is a bounded preference."
  class: drafting
  source:
    issues: [798, 1189]
    tests:
      - "tests/test_issue_798_floor_cardinality.py::test_a_callout_survives_when_every_held_candidate_fails_to_render"
      - "tests/test_issue_798_floor_cardinality.py::test_the_held_fallback_places_the_least_cutting_candidate"
      - "tests/test_issue_798_floor_cardinality.py::test_a_clear_route_still_wins_immediately"
      - "tests/test_issue_798_floor_cardinality.py::test_a_job_with_no_acceptable_candidate_at_all_is_dropped"
    corpus_parts: []
  status: ported
  rust_test: "rendering::leaders::a_leader_has_a_horizontal_shoulder_and_reads_outward"
  rust_note: "A callout whose every candidate is blocked takes the least blocked (src/dims/leaders.rs: hard blockers, then crossings, then text touched, then ink out of its view's area, then length), and the plan reports what it still crosses (annotation_leader_crossing, annotation_ink_overlap, annotation_over_view, ...). No callout is dropped for routing; only an item no shown view can carry is unplaced (view_plan_incomplete). Material cutting is the leader re-entering the material after leaving it at its tip, measured over each solid's projected box (src/material.rs, shared with lint, ADR2-8)."
  port_note: "Keep: leader router unit test; plan records the crossing as a problem rather than dropping the callout."

- id: ISSUE-798-b
  statement: "Leader-through-material cost is a measured magnitude: only re-entry into material (a second body, or the body again) counts; exiting the leader's own body or passing over a through-hole or void does not."
  class: drafting
  source:
    issues: [798]
    tests:
      - "tests/test_issue_798_material_field.py::test_a_leader_exiting_its_own_body_is_not_a_defect"
      - "tests/test_issue_798_material_field.py::test_cutting_a_second_body_is_the_defect"
      - "tests/test_issue_798_material_field.py::test_passing_over_a_through_hole_is_not_a_reentry"
      - "tests/test_issue_798_material_field.py::test_the_defect_is_a_magnitude_not_a_flag"
      - "tests/test_issue_798_material_field.py::test_a_crossing_segment_measures_only_the_traversed_part"
    corpus_parts: []
  status: ported
  rust_test: "src/material.rs::tests::cutting_a_second_body_is_measured"
  rust_note: "Stream K4, src/material.rs (tests: a_leader_exiting_its_own_body_is_not_a_reentry, cutting_a_second_body_is_measured, the_reentry_is_a_magnitude_not_a_flag; on a drawing: tests/leader_rules.rs::a_shaft_cutting_back_into_the_material_is_reported_with_its_depth): only material after the exit at the tip counts; exiting the own body, passing over a bore inside it, or a gap of 0.05 mm or less does not; a second body or the body again is measured over the part traversed. Material is each solid's projected box, so a through hole inside it is never a second traversal; a shaft over a concave notch reads as cutting (conservative). A tip already clear of the material is charged for its first traversal too."
  port_note: "Keep: unit tests on the projected material field / segment-span probe."

