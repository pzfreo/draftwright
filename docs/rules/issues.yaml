  rust_test: rendering::placement::a_starved_overall_extent_has_first_claim_on_the_opposite_strip
  rust_note: "src/dims/placement.rs::fall_through: a strip holds its linear dimensions (an overall extent among them) up to the first lane whose item does not fit the page (on the sheet, its label off the views and the title block, no line through the title block or another view); that item and those outside it take the next free lanes of the strip across the view, each that fits there, an overall extent first (then moved outside the others where that still fits). On cgb245 and m1000 the front's overall height takes the one lane left of the front, clear of the side view, ahead of the rung or location that would reach it first; on ftc06 the front's width takes the one lane above the front, off the isometric. One that fits on neither side keeps its lane and is reported (annotation_off_sheet, annotation_over_view, annotation_line_over_view), never dropped: draftwright drops it and reports the drop (rust-correct by the port's honest-failure rule; the plan keeps every item, R1 invariant 3). Beyond draftwright, every linear dimension falls through, not only an extent (draftwright's slot dimensions do too, _slots.py): rust-correct, since draftwright leaves such an item in its starved strip, where on cgb245 the plan's left-strip items ran off the sheet (10 annotation_off_sheet errors), while a moved item measures the same span from the same edge and so reads as the same baseline dimension, only from the clear side; its cost is a split ladder (cgb245's plan y locations stand right of the plan apart from the two its left strip holds; tests/placement.rs::a_strip_without_room_falls_through_to_the_opposite_strip). Not-applicable: the withholding and its retraction once every mark is drawn (the port withholds no extent). On cgb245 the plan's left-strip items left the sheet 10 times before; 1 is left (tests/fixtures/known_placement.json). Also checked by tests/placement.rs::what_does_not_fit_the_page_is_reported (what still does not fit is reported, on every part) and tests/issue_drafting.rs::an_overall_extent_is_placed_or_reported."
  port_note: "Keep."

