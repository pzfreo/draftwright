- id: ISSUE-367-a
  statement: "Leader collision checks use the leader's rendered ink, including arrowhead flare and shaft stroke width, not the idealised zero-width centreline."
  detail: "Arrowhead clearance is local to the tip, not the whole shaft; a zero-length leader still has a local ink extent."
  class: drafting
  source:
    issues: [367]
    tests:
      - "tests/test_issue_367_leader_ink.py::test_arrowhead_flare_is_collision_evidence_beyond_the_idealised_segment"
      - "tests/test_issue_367_leader_ink.py::test_heavy_shaft_width_is_collision_evidence_beyond_the_centreline"
      - "tests/test_issue_367_leader_ink.py::test_arrowhead_clearance_is_local_to_the_tip_not_the_whole_shaft"
      - "tests/test_issue_367_leader_ink.py::test_zero_length_leader_uses_its_local_ink_extent"
    corpus_parts: []
  status: ported
  rust_test: "src/dims/placement.rs::tests::a_callouts_arrowhead_flare_is_collision_evidence"
  rust_note: "Ported (2026-10-22 evaluation; stream K4): a callout's collision check (src/dims/placement.rs::collisions, annotation_ink_overlap) reads its rendered ink through dims::placement::ink_through: its lines and each arrowhead's filled flare (2.7 by 0.9 mm as drawn), tested at the tip only, so a flare-only contact is reported; the leader router already scores its own and the fixed items' flares against labels. Linear dimensions keep the centreline test their placement (settle) uses. Retired: the shaft stroke width, 0.025 mm per side, which is below any clearance the placers keep and only turned 0.01 mm grazes into hard findings (it moved hw_string_post_tapped_intent from A3 5:1 to a crowded A4 2:1); and the zero-length leader, which the port never draws."
  port_note: "triage 2026-10-16: PORT, value low, size M, stream leaders-and-tips"

