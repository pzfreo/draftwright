# Rules catalogue: lessons guarded by draftwright's issue-numbered regression tests.
# Source: draftwright origin/main @ 586628b96db6779454d499c7d92d37f1aa8f1df9
# Extracted from tests/test_issue_<n>_*.py module docstrings, test names and test docstrings.
