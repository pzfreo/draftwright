- id: ISSUE-563-b
  statement: "Every explicitly placed or source linear dimension has its corridor reserved during view composition, outside the scaled view, without forcing an unnecessary scale reduction."
  class: drafting
  source:
    issues: [563, 2192]
    tests:
      - "tests/test_issue_563_placement_intent.py::test_compose_reserves_every_supported_measured_corridor_family"
      - "tests/test_issue_563_placement_intent.py::test_every_explicit_measured_corridor_stays_outside_scaled_view"
      - "tests/test_issue_563_placement_intent.py::test_unhinted_source_linear_dimensions_reserve_their_render_routes_issue_2192"
      - "tests/test_issue_563_placement_intent.py::test_plan_right_corridor_does_not_force_feasible_a4_scale_reduction"
    corpus_parts: []
  status: ported
  rust_note: "Maintainer approval 2026-10-16 applied: composition reserves every source linear corridor, including below front and above/left of plan, and all authored principal strips at their requested or respaced lanes. Complete automatic composition (escalated/recovered planning) measures the settled linear ink, including reflow, labels and outside-arrow corner reach, from the full inventory. Established witness and leader routes, including settled GD&T, are transported with their owning view block without changing their attachment or placement decisions; the isometric is fitted against the resulting footprints. Preferred-scale reductions are permitted to keep corridors inside their reserved area and on the sheet. A single tolerance/fit edit retains the complete unedited projection frame while reserving the edited ink; bulk tolerancing receives complete composition. Edited labels are settled at their new widths. An explicitly named sheet/scale retains its projection origins and section-mark frame while reserving the complete ink; automatic candidates may repack free blocks. The low-level single-pass estimate retains its original band-overrun diagnostics; every drawing API uses the complete compose-then-pack path. For dimension-only drawings, if no complete candidate exists and measured corridors make the seed run off paper, a physically fitting candidate with no hard findings may carry every seed measurement, still reporting all missing requirements. Unreadable GD&T seeds keep their established bands and recovery contract; legible settled blocks compose from their measured ink without changing attachment or placement decisions. No part-specific exceptions."
  rust_test: "rendering::views_layout_rules::every_source_and_explicit_linear_corridor_is_reserved; rendering::views_layout_rules::explicit_dimensions_that_reflow_keep_their_reserved_corridors; rendering::views_layout_rules::reserved_location_corridors_choose_witnesses_clear_of_foreign_holes"
  port_note: "triage 2026-10-16: PORT, value medium, size M, stream views-and-layout"

