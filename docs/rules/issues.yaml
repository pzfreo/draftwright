irst plan, until the layout reserved the band right of the front and the plan for the front's lanes, stream d-quality-lanes; ftc07 now takes draftwright's A2 1:2 directly, tests/page_escalation.rs::ftc07_takes_draftwrights_first_choice, and no corpus case meets the gate). On tools/quality_parts.txt (native, after drawing quality 3) it moves no part: ctc01 keeps A3 1:5, draftwright's choice (its label off the sheet is gone since the layout keeps the isometric off the plan's bands); ftc07 now takes A2 1:2, draftwright's first choice (since stream d-quality-lanes); the others' tries are never clean, as draftwright's are not (ctc02, ctc03, ctc04, ctc05, ftc08, ftc09, ftc10, cgb245 keep their first plans with layout_recovery_exhausted, their hole locations past bands that are draftwright's estimates: the hole-table case). Not done: escalation cannot clear those, as each larger sheet is filled to draftwright's band estimates again. GRM-03 (Python quiddity's recognition) stays A4 2:1 (draftwright 5:1 through its recovery detail, which the port does not plan: not-applicable); m10127 stays A4 1:1 (draftwright A3 2:1 on its own ink overlap: undetermined). Closed by the rules assessment of 2026-10-11: the parts still exhausted are the hole-table case (ARCH0009-2, ISSUE-1144-b)."
