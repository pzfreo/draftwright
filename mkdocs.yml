site_name: draftwright API reference
site_url: https://pzfreo.github.io/draftwright/
repo_url: https://github.com/pzfreo/draftwright
repo_name: pzfreo/draftwright
docs_dir: docs
exclude_docs: |
  adr/
  plans/
  research/
  deprecations.md
  layout-algorithm-primer.md
  multi-feature-object-reference-workflow.md
  target-architecture.md
  images/

nav:
  - Home: index.md
  - API reference:
      - Entry points: reference/entry-points.md
      - Sheet and fluent handles: reference/sheet.md
      - Drawing results: reference/drawing.md
      - Feature declarations: reference/declarations.md
      - External spur gear requirements: reference/external-spur-gears.md

theme:
  name: mkdocs

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            docstring_options:
              warn_missing_types: false
            heading_level: 2
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            members_order: source
            inherited_members: false

markdown_extensions:
  - admonition
  - toc:
      permalink: true

strict: true
