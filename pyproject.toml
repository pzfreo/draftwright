[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "draftwright"
# One version for Cargo, release tags and wheels (maturin's default).
dynamic = ["version"]
description = "Engineering drawings from STEP: Rust CLI and a small Python API."
readme = "README.md"
requires-python = ">=3.9"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "THIRD-PARTY-LICENSES", "fonts/LICENSE-*.txt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Rust",
    "Topic :: Multimedia :: Graphics",
]

[project.scripts]
draftwright = "draftwright._cli:main"
draftwright-mcp = "draftwright._cli:mcp"

[project.urls]
Homepage = "https://draftwright.io"
Repository = "https://github.com/pzfreo/draftwright"
Issues = "https://github.com/pzfreo/draftwright/issues"
Releases = "https://github.com/pzfreo/draftwright/releases"

[tool.maturin]
bindings = "pyo3"
manifest-path = "crates/draftwright-py/Cargo.toml"
python-source = "python"
module-name = "draftwright._native"
features = ["extension-module"]
strip = true
